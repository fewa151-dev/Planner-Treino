/* ---------- Calendário de treinos (estilo GitHub) ---------- */
const PERIODOS = [['max', 'Máx'], ['12', '12M'], ['6', '6M'], ['3', '3M'], ['1', '1M']];
const NIVEIS = ['Sem treino', 'Até 49%', '50–74%', '75–99%', '100%'];
const TEXTO_PERIODO = { max: 'desde o primeiro treino', 12: 'nos últimos 12 meses', 6: 'nos últimos 6 meses', 3: 'nos últimos 3 meses', 1: 'no último mês' };
const somarDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
// Início do período de n meses até hoje, sem "pular" de mês (ex.: 31 de março − 1 mês = 28/29 de fevereiro)
function mesesAtras(n) {
  const hoje = inicioDoDia(Date.now());
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() - n + 1, 0).getDate();
  return somarDias(new Date(hoje.getFullYear(), hoje.getMonth() - n, Math.min(hoje.getDate(), ultimoDia)), 1);
}
const chaveDia = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const fmtMes = (d, comAno) => MESES[d.getMonth()] + (comAno ? ` ${anoCurto(d)}` : '');

// Intensidade do dia = (séries + cardios feitos) ÷ (séries + cardios planejados) do(s) treino(s) daquele dia
const fracaoDia = info => (info.feitas + info.cardioFeitos) / Math.max(1, info.planejadas + info.cardioPlanejados);
function nivelDia(info) {
  if (!info || !(info.feitas + info.cardioFeitos)) return 0;
  const p = fracaoDia(info);
  return p >= 1 ? 4 : p >= 0.75 ? 3 : p >= 0.5 ? 2 : 1;
}

function treinosPorDia() {
  const porDia = new Map();
  for (const h of S.historico) {
    const k = chaveDia(new Date(h.inicio));
    const info = porDia.get(k) || { feitas: 0, planejadas: 0, cardioFeitos: 0, cardioPlanejados: 0, nomes: [] };
    info.feitas += seriesFeitas(h);
    info.planejadas += h.planejadas;
    info.cardioFeitos += h.exercicios.filter(ehCardio).length;
    info.cardioPlanejados += h.cardioPlanejados;
    info.nomes.push(h.nome);
    porDia.set(k, info);
  }
  return porDia;
}

function calendarioHTML() {
  aoMontar.push(desenharCalendario);
  return `<section class="panel cal" aria-labelledby="cal-titulo">
    <div><h2 id="cal-titulo">Calendário de treinos</h2><p class="small muted" id="cal-resumo"></p></div>
    ${filtrosHTML(PERIODOS, 'periodo', ui.periodo, 'Período do calendário')}
    <div class="heat" id="heat"></div>
    <div class="legenda" aria-hidden="true"><span>Treino feito no dia:</span>${NIVEIS.map((txt, n) => `<span><i class="sw h${n}"></i>${txt}</span>`).join('')}</div>
  </section>`;
}

function desenharCalendario() {
  const box = $('#heat');
  if (!box) return;

  // Período: Máx vai do primeiro treino até hoje (mínimo de 1 mês; sem histórico, 12 meses)
  const hoje = inicioDoDia(Date.now());
  const primeiro = S.historico.reduce((m, h) => Math.min(m, h.inicio), Infinity);
  const inicio = ui.periodo !== 'max' ? mesesAtras(Number(ui.periodo))
    : Number.isFinite(primeiro) ? new Date(Math.min(inicioDoDia(primeiro), mesesAtras(1))) : mesesAtras(12);
  const comeco = somarDias(inicio, -((inicio.getDay() + 6) % 7)); // segunda-feira da 1ª semana
  const totalDias = Math.round((hoje - comeco) / DIA_MS) + 1;
  const semanas = Math.ceil(totalDias / 7);

  // Medidas: colunas = semanas, linhas = Seg a Dom; células encolhem para caber sem rolagem lateral
  const largura = box.clientWidth;
  const ROTULO = 30, TOPO = 18, MAXIMO = 26;
  let passo = Math.min(MAXIMO, (largura - ROTULO) / semanas);
  const comDiasSemana = passo >= 9;
  if (!comDiasSemana) passo = Math.min(MAXIMO, largura / semanas);
  const esq = comDiasSemana ? ROTULO : 0;
  const cel = Math.max(1, passo - (passo >= 12 ? 2 : 1));
  const W = esq + semanas * passo, H = TOPO + 7 * passo;
  // Geometria num lugar só: dia → canto da célula, e ponto (x, y) → dia
  const pos = i => ({ x: esq + Math.floor(i / 7) * passo, y: TOPO + (i % 7) * passo });
  const indice = (x, y) => {
    const col = Math.floor((x - esq) / passo), lin = Math.floor((y - TOPO) / passo);
    return x < esq || y < TOPO || lin > 6 ? -1 : col * 7 + lin;
  };

  const porDia = treinosPorDia();
  const dias = [];
  let celulas = '', meses = '', ultimoX = -Infinity, primeiroRotulo = true, treinados = 0, completos = 0;
  for (let i = 0, d = new Date(comeco); i < totalDias; i++, d.setDate(d.getDate() + 1)) {
    if (d < inicio) { dias.push(null); continue; }
    const info = porDia.get(chaveDia(d));
    const n = nivelDia(info);
    dias.push({ d: new Date(d), info, n });
    if (n) { treinados++; if (n === 4) completos++; }
    const { x, y } = pos(i);
    celulas += `<rect class="h${n}" data-i="${i}" x="${x}" y="${y}" width="${cel}" height="${cel}" rx="${Math.min(3, cel / 4)}"/>`;
    // Nome do mês na coluna em que ele começa ("Jan 26" no primeiro rótulo e em janeiro).
    // No primeiro dia do período, só se ainda sobram 3 semanas daquele mês.
    const comecaMes = d.getDate() === 1 || (+d === +inicio && new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() >= 20);
    if (comecaMes && x - ultimoX >= 36 && x + 30 <= W) {
      meses += `<text x="${x}" y="12">${fmtMes(d, primeiroRotulo || d.getMonth() === 0)}</text>`;
      ultimoX = x;
      primeiroRotulo = false;
    }
  }
  const diasSemana = comDiasSemana
    ? [['Seg', 0], ['Qua', 2], ['Sex', 4]].map(([t, l]) => `<text x="0" y="${pos(l).y + cel / 2 + 4}">${t}</text>`).join('')
    : '';

  const resumo = !S.historico.length ? 'Nenhum treino concluído ainda. Ao concluir um treino, o dia aparece aqui.'
    : treinados ? `${plural(treinados, 'dia de treino', 'dias de treino')} ${TEXTO_PERIODO[ui.periodo]}, ${plural(completos, 'completo', 'completos')}.`
    : `Nenhum treino ${TEXTO_PERIODO[ui.periodo]}.`;
  $('#cal-resumo').textContent = resumo;

  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(resumo)} Use as setas para ver cada dia.">${meses}${diasSemana}${celulas}</svg><div class="dica" role="status" hidden></div>`;
  const svg = box.querySelector('svg');
  ligarGrafico({
    box, svg, largura, desenhar: desenharCalendario,
    // Teclado: cima/baixo = dia, esquerda/direita = semana
    teclas: { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 }, ultimo: dias.length - 1,
    valido: i => !!dias[i],
    achar: indice, // a área de toque é a célula mais o espaço em volta
    ancora: i => ({ x: pos(i).x + cel / 2, y: pos(i).y }),
    marcar: i => {
      svg.querySelector('rect.ativo')?.classList.remove('ativo');
      if (i >= 0) svg.querySelector(`rect[data-i="${i}"]`)?.classList.add('ativo');
    },
    conteudo: i => {
      const { info, d } = dias[i];
      // "18 de 18 séries + 1 de 1 cardio (100%)"
      const partes = !info ? [] : [
        info.planejadas && `${info.feitas} de ${info.planejadas} séries`,
        info.cardioPlanejados && `${info.cardioFeitos} de ${plural(info.cardioPlanejados, 'cardio', 'cardios')}`,
      ].filter(Boolean);
      return [
        elTexto('b', info ? `${partes.join(' + ')} (${Math.round(fracaoDia(info) * 100)}%)` : 'Sem treino'),
        ...(info ? [elTexto('span', info.nomes.join(' + '))] : []),
        elTexto('span', fmtData(d), 'data'),
      ];
    },
  });
}

/* ---------- Dica dos gráficos (calendário e linhas) ---------- */
// Textos entram com textContent: nomes de treino e de exercício vêm do usuário
const elTexto = (tag, txt, cls) => { const el = document.createElement(tag); el.textContent = txt; if (cls) el.className = cls; return el; };
let DICA_ABERTA = null; // gráfico com a dica aberta: tocar fora dele fecha

// Redesenha um gráfico só quando a largura do quadro muda de verdade (girar o celular, redimensionar a janela)
const GRAFICOS = new WeakMap();
const observador = new ResizeObserver(entradas => {
  for (const { target, contentRect } of entradas) {
    const g = GRAFICOS.get(target);
    if (g && Math.round(contentRect.width) !== Math.round(g.largura)) { GRAFICOS.delete(target); requestAnimationFrame(g.desenhar); }
  }
});
function soltarGraficos() { observador.disconnect(); DICA_ABERTA = null; }

// Liga um gráfico desenhado. g diz como achar o item embaixo do ponteiro (achar), onde a dica fica no teclado
// (ancora), o que ela mostra (conteudo) e como destacar o item (marcar).
// No PC a dica segue o mouse; no celular um toque abre, segurar e arrastar faz a dica seguir o dedo e tocar fora fecha;
// no teclado, as setas andam pelos itens.
function ligarGrafico(g) {
  const { svg } = g;
  g.dica = g.box.querySelector('.dica');
  g.ativo = -1;
  GRAFICOS.set(g.box, g);
  observador.observe(g.box);
  const apontar = (cx, cy, modo) => {
    const r = svg.getBoundingClientRect(), x = cx - r.left, y = cy - r.top, i = g.achar(x, y);
    if (g.valido(i)) mostrarDica(g, i, x, y, modo); else esconderDica(g);
  };
  const focar = i => { if (!g.valido(i)) return; const { x, y } = g.ancora(i); mostrarDica(g, i, x, y, 'teclado'); };
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') apontar(e.clientX, e.clientY, 'mouse'); });
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') esconderDica(g); });
  let toque = null;
  svg.addEventListener('touchstart', e => {
    const t = e.touches[0];
    toque = { x: t.clientX, y: t.clientY, segurando: false };
    toque.timer = setTimeout(() => { if (toque) { toque.segurando = true; apontar(toque.x, toque.y, 'toque'); } }, 180);
  }, { passive: true });
  svg.addEventListener('touchmove', e => {
    if (!toque) return;
    const t = e.touches[0];
    if (toque.segurando) { e.preventDefault(); apontar(t.clientX, t.clientY, 'toque'); }
    else if (Math.hypot(t.clientX - toque.x, t.clientY - toque.y) > 8) { clearTimeout(toque.timer); toque = null; } // virou rolagem da página
  }, { passive: false });
  svg.addEventListener('touchend', () => {
    if (!toque) return;
    clearTimeout(toque.timer);
    if (!toque.segurando) apontar(toque.x, toque.y, 'toque');
    toque = null;
  });
  svg.addEventListener('touchcancel', () => { if (toque) clearTimeout(toque.timer); toque = null; });
  svg.addEventListener('focus', () => { if (svg.matches(':focus-visible') && g.ativo < 0) focar(g.ultimo); });
  svg.addEventListener('blur', () => esconderDica(g));
  svg.addEventListener('keydown', e => {
    if (e.key === 'Escape') return esconderDica(g);
    const passo = g.teclas[e.key];
    if (!passo) return;
    e.preventDefault();
    focar((g.ativo < 0 ? g.ultimo : g.ativo) + passo);
  });
}

function mostrarDica(g, i, x, y, modo) {
  const { dica } = g;
  if (g.ativo !== i) {
    g.ativo = i;
    g.marcar(i);
    dica.replaceChildren(...g.conteudo(i));
    dica.hidden = false;
    g.tw = dica.offsetWidth; // mede só quando o conteúdo muda
    g.th = dica.offsetHeight;
  }
  DICA_ABERTA = g;
  // No PC a dica fica ao lado do mouse; no toque e no teclado, acima do dedo/do item
  let left = modo === 'mouse' ? x + 14 : x - g.tw / 2;
  const top = modo === 'mouse' ? y + 16 : y - g.th - 20;
  if (modo === 'mouse' && left + g.tw > g.largura) left = x - g.tw - 14;
  dica.style.left = `${Math.max(0, Math.min(left, g.largura - g.tw))}px`;
  dica.style.top = `${top}px`;
}

function esconderDica(g) {
  g.dica.hidden = true;
  if (g.ativo >= 0) { g.ativo = -1; g.marcar(-1); }
  if (DICA_ABERTA === g) DICA_ABERTA = null;
}

document.addEventListener('pointerdown', e => { if (DICA_ABERTA && !DICA_ABERTA.box.contains(e.target)) esconderDica(DICA_ABERTA); });

/* ---------- Gráficos de linha da Biblioteca ---------- */
// Escala do eixo vertical com números redondos (cerca de 4 faixas); nunca abaixo de zero
function escalaY(min, max) {
  if (min === max) { const folga = Math.abs(min) * 0.1 || 1; min = Math.max(0, min - folga); max += folga; }
  const bruto = (max - min) / 4, mag = 10 ** Math.floor(Math.log10(bruto));
  const passo = [1, 2, 2.5, 5, 10].map(m => m * mag).find(p => p >= bruto);
  const y0 = Math.max(0, Math.floor(min / passo) * passo), y1 = Math.ceil(max / passo) * passo;
  const marcas = [];
  for (let v = y0; v <= y1 + passo / 2; v += passo) marcas.push(Math.round(v * 1e6) / 1e6);
  return { y0, y1, marcas };
}

// Linhas no tempo: cada ponto é um dia de treino (ou um registro de peso). cfg = { titulo, dias: [{ t, treino }],
// series: [{ nome, cor, valores }], fmt, unidade: [um, vários], quando: "nos últimos 12 meses" } (valores null = nada
// naquele dia; treino é a linha cinza da dica). O eixo vai do primeiro dia do período até hoje, para mostrar as pausas.
function desenharLinhas(box, cfg) {
  const usados = cfg.dias.map((_, i) => i).filter(i => cfg.series.some(s => s.valores[i] != null));
  if (!usados.length) { box.innerHTML = '<p class="hint">Nada registrado neste período.</p>'; return; }
  const dias = usados.map(i => cfg.dias[i]);
  const series = cfg.series.map(s => ({ ...s, valores: usados.map(i => s.valores[i]) }));
  const largura = box.clientWidth;
  const ESQ = 44, DIR = 12, TOPO = 10, ALT = 150, BASE = 26, H = TOPO + ALT + BASE, larg = largura - ESQ - DIR;
  const valores = series.flatMap(s => s.valores).filter(v => v != null);
  const { y0, y1, marcas } = escalaY(Math.min(...valores), Math.max(...valores));
  const t0 = +inicioDoDia(dias[0].t), t1 = Math.max(+inicioDoDia(Date.now()), +inicioDoDia(dias[dias.length - 1].t));
  const x = t => ESQ + (t1 === t0 ? larg / 2 : (+inicioDoDia(t) - t0) / (t1 - t0) * larg);
  const y = v => TOPO + ALT - (v - y0) / (y1 - y0) * ALT;
  const xs = dias.map(d => x(d.t));
  const grade = marcas.map(v => `<line class="grade" x1="${ESQ}" x2="${largura - DIR}" y1="${y(v)}" y2="${y(v)}"/><text x="${ESQ - 8}" y="${y(v) + 4}" text-anchor="end">${NUM2.format(v)}</text>`).join('');
  // Datas embaixo: até 6, espaçadas por igual; períodos longos mostram só mês e ano
  const nDatas = t1 === t0 ? 1 : Math.max(2, Math.min(6, Math.floor(larg / 72)));
  const datas = Array.from({ length: nDatas }, (_, i) => {
    const t = nDatas === 1 ? t0 : t0 + (t1 - t0) * i / (nDatas - 1), d = new Date(t);
    const ancora = nDatas === 1 ? 'middle' : i === 0 ? 'start' : i === nDatas - 1 ? 'end' : 'middle';
    return `<text x="${x(t)}" y="${H - 6}" text-anchor="${ancora}">${t1 - t0 > 150 * DIA_MS ? fmtMes(d, true) : fmtDiaMes(t)}</text>`;
  }).join('');
  const camadas = [...series].sort((a, b) => !!a.frente - !!b.frente); // a série "da frente" por último, por cima
  const linhas = camadas.map(s => {
    let caminho = '', comando = 'M';
    s.valores.forEach((v, i) => {
      if (v == null) { comando = 'M'; return; }
      caminho += `${comando}${xs[i].toFixed(1)} ${y(v).toFixed(1)}`;
      comando = 'L';
    });
    return `<path class="linha" style="stroke:${s.cor}" d="${caminho}"/>`;
  }).join('');
  const ponto = (s, i, r) => s.valores[i] == null ? '' : `<circle class="ponto" cx="${xs[i].toFixed(1)}" cy="${y(s.valores[i]).toFixed(1)}" r="${r}" style="fill:${s.cor}"/>`;
  const pontos = dias.length > 40 ? '' : camadas.map(s => dias.map((_, i) => ponto(s, i, 4)).join('')).join('');
  const rotulo = `${cfg.titulo}: ${plural(dias.length, ...cfg.unidade)} ${cfg.quando}. Use as setas para ver cada dia.`;
  box.innerHTML = `<svg width="${largura}" height="${H}" viewBox="0 0 ${largura} ${H}" tabindex="0" role="img" aria-label="${esc(rotulo)}">${grade}${datas}${linhas}${pontos}<line class="mira" y1="${TOPO}" y2="${TOPO + ALT}" visibility="hidden"/><g class="ativos"></g></svg><div class="dica" role="status" hidden></div>`;
  const svg = box.querySelector('svg'), mira = svg.querySelector('.mira'), ativos = svg.querySelector('.ativos');
  // A mira acha o dia mais perto do ponteiro na horizontal; a dica lista todas as linhas daquele dia
  ligarGrafico({
    box, svg, largura, desenhar: () => desenharLinhas(box, cfg),
    teclas: { ArrowLeft: -1, ArrowRight: 1 }, ultimo: dias.length - 1,
    valido: i => i >= 0 && i < dias.length,
    achar: px => xs.reduce((perto, v, i) => Math.abs(v - px) < Math.abs(xs[perto] - px) ? i : perto, 0),
    ancora: i => ({ x: xs[i], y: Math.min(...series.filter(s => s.valores[i] != null).map(s => y(s.valores[i]))) }),
    marcar: i => {
      mira.setAttribute('visibility', i < 0 ? 'hidden' : 'visible');
      if (i >= 0) { mira.setAttribute('x1', xs[i]); mira.setAttribute('x2', xs[i]); }
      ativos.innerHTML = i < 0 ? '' : camadas.map(s => ponto(s, i, 5.5)).join('');
    },
    conteudo: i => [
      elTexto('b', fmtData(dias[i].t)),
      elTexto('span', dias[i].treino, 'data'),
      ...series.filter(s => s.valores[i] != null).map(s => {
        const linha = document.createElement('span');
        const chave = document.createElement('i');
        chave.style.setProperty('--c', s.cor);
        linha.className = 'val';
        linha.append(chave, elTexto('b', cfg.fmt(s.valores[i])), series.length > 1 ? ` ${s.nome.toLowerCase()}` : '');
        return linha;
      }),
    ],
  });
}

/* ---------- Janela do exercício ---------- */
// Valor sugerido (aparece apagado no campo e entra ao marcar como feita)
// Séries de trabalho (e trechos de cardio): a mesma série da última vez (a 2ª série T mostra o peso da 2ª série T
// do treino anterior); se ela não existia, a série anterior de hoje; por fim, a última da última vez.
// Aquecimento e preparação: a porcentagem da carga de trabalho de hoje (sugestaoPreparo).
function sugestao(e, anteriores, i) {
  const s = e.sets[i];
  if (s?.tipo) return sugestaoPreparo(e, anteriores, s);
  const hoje = e.sets.filter(ehTrabalho), antes = anteriores.filter(ehTrabalho);
  const k = s ? hoje.indexOf(s) : hoje.length; // sem s: a linha que ainda vai entrar no fim
  const fontes = [antes[k], hoje[k - 1], antes[antes.length - 1]];
  const pegar = (c, padrao) => fontes.find(f => !vazio(f?.[c]))?.[c] ?? padrao;
  const r = Object.fromEntries(camposDe(e).map(c => [c, pegar(c, c === 'reps' ? repsAlvo(e.reps) : CAMPOS[c].padrao ?? '')]));
  if (s && s === serieAteFalha(e)) r.rir = 0; // F: até a falha
  return r;
}
// Carga de trabalho de hoje: o peso da 1ª série T (o digitado ou o sugerido, que vem da última vez)
function cargaDeTrabalho(e, anteriores) {
  const i = e.sets.findIndex(ehTrabalho);
  const peso = i < 0 ? '' : vazio(e.sets[i].peso) ? sugestao(e, anteriores, i).peso : e.sets[i].peso;
  return typeof peso === 'number' && peso > 0 ? peso : null;
}
// A e P: peso = % da carga de trabalho, de 5 em 5 kg (mínimo 5, sem passar da própria carga de trabalho);
// repetições = as da última vez nessa mesma série
function sugestaoPreparo(e, anteriores, s, base = cargaDeTrabalho(e, anteriores)) {
  const antes = anteriores.find(x => x.tipo === s.tipo && x.pct === s.pct);
  return { peso: base ? Math.min(base, de5em5(base * s.pct / 100)) : '', reps: antes?.reps ?? REPS_PREPARO[s.pct] ?? '', rir: '' };
}

// Antes das séries de trabalho entram as de aquecimento e preparação escolhidas no treino. Em Automático, pela ordem
// do exercício no grupo muscular de hoje (conta quem já tem série feita, então vale a ordem em que você faz).
// Refaz enquanto o exercício não foi começado: nenhuma série marcada e nenhuma série A ou P preenchida.
const grupoNaSessao = e => { const g = exPorId(e.exId)?.grupo; return g && g !== 'outro' ? g : `ex:${e.exId}`; };
function jaFeitosDoGrupo(e) {
  const grupo = grupoNaSessao(e);
  return S.sessao.exercicios.filter(x => x !== e && !ehCardio(x) && grupoNaSessao(x) === grupo && x.sets.some(s => s.feita)).length;
}
// Devolve true se as séries mudaram
function planejarPreparo(e) {
  if (ehCardio(e) || e.sets.some(s => s.feita || (s.tipo && (!vazio(s.peso) || !vazio(s.reps))))) return false;
  const plano = PLANOS[e.preparo || PREPARO[Math.min(jaFeitosDoGrupo(e), PREPARO.length - 1)]].series, atual = e.sets.filter(s => s.tipo);
  if (plano.length === atual.length && plano.every(([tipo, pct], i) => atual[i].tipo === tipo && atual[i].pct === pct)) return false;
  e.sets = [...plano.map(([tipo, pct]) => ({ ...novaLinha(e, 0), tipo, pct })), ...trabalho(e)];
  return true;
}

// Nome da linha para leitores de tela: "série de aquecimento", "série de preparação 2", "série de trabalho 3", "trecho 1"
function nomeLinha(e, i, falha = serieAteFalha(e)) {
  if (ehCardio(e)) return `trecho ${i + 1}`;
  const s = e.sets[i], mesmas = e.sets.filter(x => tipoSerie(x) === tipoSerie(s));
  return `série de ${NOME_TIPO[tipoSerie(s)].toLowerCase()}${mesmas.length > 1 ? ` ${mesmas.indexOf(s) + 1}` : ''}${s === falha ? ', até a falha' : ''}`;
}

// Séries (musculação) ou trechos (cardio) da janela aberta, com os botões de pôr e tirar.
// Na musculação, cada série mostra a letra do tipo (A, P ou T) e, embaixo, o descanso depois dela, que dá para mudar
// (no 1º exercício de um bi-set, a série de trabalho não tem descanso: vem o outro exercício). A última série de
// trabalho de um exercício com F leva um F ao lado do T, da semana 3 em diante. b: o par do bi-set.
// No cardio, cada trecho tem um espaço para a conta, preenchido por atualizarCalc.
function linhasHTML(e, anteriores = ultimasSeries(e.exId), b = parDoBiset(e)) {
  const falha = serieAteFalha(e);
  const nomes = e.sets.map((_, i) => nomeLinha(e, i, falha)); // para leitores de tela
  const campos = camposDe(e), t = tipoDe(e), cardio = ehCardio(e), colunas = `style="--n:${campos.length}${cardio ? '' : ';--c1:50px'}"`;
  const campo = (s, i, ph) => k => {
    const c = CAMPOS[k], alvo = `data-f="s-${k}" data-i="${i}" aria-label="${c.aria}, ${nomes[i]}"`;
    if (c.opcoes) return `<select class="field" ${alvo}>${Object.entries(c.opcoes).map(([v, o]) => `<option value="${v}"${s[k] === v ? ' selected' : ''}>${o.nome}</option>`).join('')}</select>`;
    if (s.tipo && k === 'rir') return '<span></span>'; // aquecimento e preparação ficam longe da falha: sem RIR
    const entrada = `<input class="field num" inputmode="${c.decimal ? 'decimal' : 'numeric'}" ${alvo} value="${mostrarCampo(k, s[k])}" placeholder="${mostrarCampo(k, ph[k]) || '–'}">`;
    return !c.marca ? entrada : `<span class="com-marca">${entrada}<button class="marca-mais" data-act="mais" data-i="${i}" aria-pressed="${!!s.mais}"
      aria-label="${cap(nomes[i])}: ainda dava para fazer muito mais" title="Ainda dava para fazer muito mais">${icon('mais', 16)}</button></span>`;
  };
  const lado = (s, i) => {
    if (cardio) return `<span class="set-n num">${i + 1}</span>`;
    const tipo = tipoSerie(s), seg = descansoApos(e, s, b), ateFalha = s === falha;
    const desc = seg
      ? `<label class="desc" title="Descanso depois desta série">${icon('historico', 11)}<input class="num" inputmode="numeric" maxlength="3" data-f="r-${tipo}" value="${seg}" placeholder="${seg}" aria-label="Descanso depois da ${nomes[i]}, em segundos">s</label>`
      : `<span class="desc" title="Sem descanso: depois desta série vem ${esc(nomeItem(b.par))}">bi-set</span>`;
    return `<span class="set-lado">
        <span class="set-tipo num" title="${ateFalha ? 'Trabalho até a falha' : NOME_TIPO[tipo]}${s.tipo ? `: ${s.pct}% da carga de trabalho` : ''}">${tipo}${ateFalha ? '<span class="f">F</span>' : ''}</span>
        ${desc}
      </span>`;
  };
  return `<div class="set-grid sets-head" ${colunas} aria-hidden="true"><span>${cap(t.linha)}</span>${campos.map(k => `<span>${CAMPOS[k].rotulo}</span>`).join('')}<span></span></div>` +
    e.sets.map((s, i) => `<div class="set-grid set-row${s.feita ? ' done' : ''}${s.tipo ? ' preparo' : ''}${s === falha ? ' falha' : ''}" ${colunas}>
        ${lado(s, i)}${campos.map(campo(s, i, sugestao(e, anteriores, i))).join('')}
        <button class="check" data-act="serie-feita" data-i="${i}" aria-pressed="${s.feita}" aria-label="${cap(nomes[i])} ${t.feita}">${icon('check')}</button>
        ${cardio ? `<div class="trecho-calc" data-tc="${i}"></div>` : ''}
      </div>`).join('') +
    `<div class="dupla">
      <button class="add-btn" data-act="remover-serie"${trabalho(e).length > 1 ? '' : ' disabled'}>− Remover ${t.linha}</button>
      <button class="add-btn" data-act="add-serie">+ Adicionar ${t.linha}</button>
    </div>`;
}
// O peso cinza das séries A e P acompanha o peso digitado na 1ª série de trabalho (sem redesenhar os campos)
function atualizarPreparo(i) {
  const e = exAberto();
  if (!e || ehCardio(e) || e.sets.findIndex(ehTrabalho) !== i) return;
  const anteriores = ultimasSeries(e.exId), base = cargaDeTrabalho(e, anteriores);
  e.sets.forEach((s, j) => {
    const campo = s.tipo && $(`#sets [data-f="s-peso"][data-i="${j}"]`);
    if (campo) campo.placeholder = mostrarCampo('peso', sugestaoPreparo(e, anteriores, s, base).peso) || '–';
  });
}
// Muda o descanso de um tipo de série no exercício aberto e no treino (vale para os próximos treinos)
// e mostra o novo valor em todas as séries desse tipo, menos no campo onde a pessoa está digitando
function guardarDescanso(e, tipo, segundos, digitando) {
  const k = CAMPO_DESCANSO[tipo];
  e[k] = clampInt(segundos, 5, 600, e[k]);
  const original = exDoTreino(S.sessao.treinoId, e.id);
  if (original) original[k] = e[k];
  document.querySelectorAll(`#sets [data-f="r-${tipo}"]`).forEach(x => { if (x !== digitando) x.value = e[k]; });
  salvar();
}

/* ---------- Calculadora do cardio ---------- */
// O quadro fica sempre montado (com "–" até ter dados), para a janela não pular enquanto a pessoa digita
function calcHTML(e, c) {
  const a = APARELHOS[e.aparelho], ok = c.n > 0;
  const valor = (v, fmt, unidade) => ok ? `${fmt.format(v)}${unidade ? `<small>${unidade}</small>` : ''}` : '–';
  const quadro = a.quadro(c, valor, ['Tempo', ok ? `${mostrarCampo('min', c.min)}<small>min</small>` : '–']);
  const semPeso = !(pesoAtual() > 0), semAltura = a.usaAltura && !(S.perfil.altura > 0);
  const aviso = !ok ? a.vazio
    : semPeso && semAltura ? 'Preencha seu peso e sua altura abaixo para estimar calorias e passos.'
    : semPeso ? 'Preencha seu peso abaixo para estimar as calorias.'
    : semAltura ? 'Preencha sua altura abaixo para estimar os passos.' : a.como;
  return `<h3>Calculadora</h3>
    <div class="kcal"><span>Calorias gastas</span><b class="num">${aprox(c.kcal)}<small>kcal</small></b></div>
    <div class="stats">${quadro.map(([rotulo, v]) => statHTML(rotulo, v)).join('')}</div>
    <p class="hint">${aviso}</p>`;
}

function corpoHTML(aparelho) {
  const comAltura = APARELHOS[aparelho].usaAltura;
  return `<div class="corpo">
      <label class="fld"><span>Seu peso (kg)</span><input class="field num" inputmode="decimal" data-f="p-peso" value="${fmtNum(pesoAtual())}" placeholder="Ex.: 80"></label>
      ${comAltura ? `<label class="fld"><span>Sua altura (m)</span><input class="field num" inputmode="decimal" data-f="p-altura" value="${fmtNum(S.perfil.altura)}" placeholder="Ex.: 1,75"></label>` : ''}
    </div>
    <p class="hint">${comAltura ? 'Peso e altura ficam só neste aparelho e servem para as estimativas.' : 'O peso fica só neste aparelho e serve para estimar as calorias.'} Mudar o peso aqui registra o de hoje na aba Peso.</p>`;
}

// Único lugar que faz as contas na tela: a "razão" de cada trecho (velocidade e ritmo, ou degraus por minuto)
// e o quadro da calculadora. Não mexe nos campos, para não perder o foco enquanto a pessoa digita.
function atualizarCalc() {
  const e = exAberto(), box = $('#calc');
  if (!ehCardio(e) || !box) return;
  const a = APARELHOS[e.aparelho], c = contaCardio(e, e.sets, corpoAtual());
  $('#sets').querySelectorAll('.trecho-calc').forEach(el => {
    const r = c.contas[+el.dataset.tc];
    el.innerHTML = r ? a.trecho(r) + (r.kcal == null ? '' : `<span>${aprox(r.kcal)} kcal</span>`) : '';
  });
  box.innerHTML = calcHTML(e, c);
}

function timerHTML() {
  return `<div class="timer idle" id="timer">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="ring-prog" cx="60" cy="60" r="54" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
      <div class="ring-center"><span class="timer-label" id="timer-label">Descanso</span><span class="timer-time num" id="timer-time" role="timer"></span></div>
    </div>
    <div class="adj">${[-10, -5, 5, 10].map(d => `<button data-act="timer-ajuste" data-d="${d}" aria-label="${d > 0 ? 'Mais' : 'Menos'} ${Math.abs(d)} segundos">${d > 0 ? '+' : '−'}${Math.abs(d)}s</button>`).join('')}</div>
    <div class="timer-actions"><button class="btn primary" id="timer-btn" data-act="timer-play">Iniciar descanso</button><button class="btn ghost" data-act="timer-zerar">Zerar</button></div>
  </div>`;
}

// O que cada letra quer dizer, embaixo das séries de musculação (o F, só nos exercícios que têm)
const legendaSeries = e => `<dl class="legenda-series">
  <div><dt>A</dt><dd>Aquecimento: 40% da carga de trabalho, 10 a 15 repetições, bem longe da falha.</dd></div>
  <div><dt>P</dt><dd>Preparação: com duas, 60% (8 a 10 repetições) e depois 80% (3 a 5); com uma, 80% (4 a 6). Longe da falha.</dd></div>
  <div><dt>T</dt><dd>Trabalho: carga cheia, na faixa da meta, parando com 1 ou 2 repetições sobrando. Só estas contam nos gráficos.</dd></div>
  ${e.falha ? `<div><dt>F</dt><dd>A última série de trabalho vai até a falha, da semana ${SEMANA_FALHA} do programa em diante.</dd></div>` : ''}
</dl>`;

// Lembretes do exercício no topo da janela: o bi-set, o F (conforme a semana do programa) e a observação do treino
function notasEx(e, b = parDoBiset(e)) {
  const semana = semanaDoPrograma(), nome = b && nomeItem(b.par);
  const notas = [
    b && (b.primeiro ? `Bi-set com ${nome}: marcou uma série de trabalho, o app abre o outro, sem descanso.`
      : `Bi-set com ${nome}: o descanso do par vem depois desta, e o app volta para o outro.`),
    e.falha && (semana >= SEMANA_FALHA ? 'F: a última série de trabalho vai até a falha.'
      : `F a partir da semana ${SEMANA_FALHA}. Agora é a semana ${Math.max(1, semana)}: pare com 1 ou 2 repetições sobrando.`),
    e.obs,
  ].filter(Boolean);
  return notas.length ? `<ul class="notas-ex">${notas.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
}

function abrirEx(id) {
  const e = exSessao(id);
  if (!e) return;
  ui.exAberto = id;
  const cardio = ehCardio(e), b = parDoBiset(e);
  if (!cardio && planejarPreparo(e)) salvar();
  const sub = cardio ? (e.meta ? `Meta: ${metaTxt(e)}` : 'Cardio') : `Meta: ${metaTxt(e)} ${tagsEx(e, b)}`;
  $('#sheet-root').innerHTML = `<div class="sheet-wrap">
    <div class="sheet-backdrop" data-act="fechar-ex"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <button class="icon-btn" data-act="fechar-ex" aria-label="Voltar para a lista">${icon('voltar')}</button>
        <div class="sheet-title"><h2 id="sheet-title" tabindex="-1">${esc(nomeItem(e))}</h2><p class="small muted">${sub}</p></div>
      </header>
      <div class="sheet-body">
        <div class="sets-col">
          ${cardio ? '' : notasEx(e, b) + avisoMais(e)}
          <div id="sets" class="sets">${linhasHTML(e, undefined, b)}</div>
          ${cardio ? '' : legendaSeries(e)}
          <p class="hint">${cardio ? APARELHOS[e.aparelho].dica : `Os pesos em cinza já vêm calculados. Embaixo de cada letra fica o descanso depois da série, em segundos: toque para mudar. RIR: quantas repetições ainda daria para fazer antes da falha. Toque em ${icon('mais', 14)} quando ainda dava para fazer muito mais: é o sinal para subir a carga.`}</p>
        </div>
        ${cardio ? `<div class="calc-col"><div class="calc" id="calc"></div>${corpoHTML(e.aparelho)}</div>` : timerHTML()}
      </div>
      <footer class="sheet-foot"><button class="btn primary block" data-act="finalizar-ex">${icon('check')} Finalizar ${tipoDe(e).item}</button></footer>
    </section>
  </div>`;
  document.body.classList.add('locked');
  $('#sheet-title').focus({ preventScroll: true });
  atualizarCalc();
  atualizarTimerUI();
}

function fecharEx() {
  const id = ui.exAberto;
  ui.exAberto = null;
  $('#sheet-root').innerHTML = '';
  document.body.classList.remove('locked');
  render();
  if (id) document.querySelector(`.ex-item[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
}

function marcarSerie(i) {
  const e = exAberto();
  const s = e?.sets[i];
  if (!s) return;
  const anteriores = ultimasSeries(e.exId);
  if (s.feita) { s.feita = false; salvar(); return redesenharSeries(anteriores); }
  const ph = sugestao(e, anteriores, i);
  for (const k in ph) if (vazio(s[k]) && !vazio(ph[k])) s[k] = ph[k];
  s.feita = true;
  salvar();
  if (ehCardio(e)) return redesenharSeries(anteriores); // só a musculação tem descanso
  // Bi-set: depois de uma série de trabalho, vai para o outro exercício do par, se ele ainda tem série de trabalho
  // por fazer. Do 1º para o 2º não tem descanso; depois do 2º vem o descanso do par.
  const b = parDoBiset(e), vai = ehTrabalho(s) && vaiParaOPar(b);
  iniciarDescanso(e, descansoApos(e, s, b));
  if (!vai) return redesenharSeries(anteriores);
  abrirEx(b.par.id);
  toast(b.primeiro ? `Bi-set: agora ${nomeItem(b.par)}` : `Descanso do bi-set. Depois, ${nomeItem(b.par)}`);
}

// "Ainda dava para fazer muito mais": junto com o peso, é o sinal para subir a carga no próximo treino
function alternarMais(i) {
  const s = exAberto()?.sets[i];
  if (!s) return;
  s.mais = !s.mais;
  salvar();
  redesenharSeries();
}

// Lembrete ao abrir o exercício, se na última vez alguma série ficou fácil
function avisoMais(e) {
  const faceis = ultimasSeries(e.exId).filter(s => s.mais);
  if (!faceis.length) return '';
  const pesos = faceis.map(s => s.peso).filter(v => typeof v === 'number');
  return `<p class="aviso-mais">${icon('mais', 18)}<span>Na última vez ainda dava para fazer muito mais em ${plural(faceis.length, 'série', 'séries')}${pesos.length ? `, com até ${fmtKg(Math.max(...pesos))}` : ''}. Pode ser hora de subir a carga.</span></p>`;
}

function adicionarSerie() {
  const e = exAberto();
  if (!e) return;
  const anteriores = ultimasSeries(e.exId);
  e.sets.push(novaLinha(e, e.sets.length, anteriores));
  salvar();
  redesenharSeries(anteriores);
}

// Tira a última série ou trecho (sempre fica pelo menos um trecho ou uma série de trabalho); o aviso permite desfazer
function removerSerie() {
  const e = exAberto();
  if (!e || trabalho(e).length <= 1) return;
  const t = tipoDe(e);
  comDesfazer(`${cap(t.linha)} ${e.sets.length} ${t.removida}`, () => e.sets.pop(), redesenharSeries);
}

// Atualiza as séries (ou trechos e contas) da janela aberta, ou a tela, se a janela já foi fechada
function redesenharSeries(anteriores) {
  const e = exAberto();
  if (!e) return render();
  trocarHTML($('#sets'), linhasHTML(e, anteriores));
  atualizarCalc();
}

function finalizarEx() {
  const e = exAberto();
  if (!e) return;
  // Linhas preenchidas e não marcadas contam como feitas (no cardio, basta ter o tempo)
  const t = tipoDe(e);
  e.sets.forEach(s => { if (!s.feita && !vazio(s[t.chaveFeita])) s.feita = true; });
  e.feito = true;
  salvarAgora();
  fecharEx();
  const faltam = S.sessao.exercicios.filter(x => !x.feito).length;
  toast(faltam ? `${nomeItem(e)} ${t.concluido}. Escolha o próximo.` : 'Todos os exercícios feitos. Agora é só concluir o treino.');
}

/* ---------- Cronômetro de descanso ---------- */
const T = { state: 'idle', total: 0, endAt: 0, restante: 0, exId: null, intervalo: 0 };
const TIMER_TXT = {
  idle:    { rotulo: 'Descanso',           botao: 'Iniciar descanso',   pilula: '' },
  running: { rotulo: 'Descansando',        botao: 'Pausar',             pilula: 'Descanso' },
  paused:  { rotulo: 'Pausado',            botao: 'Continuar',          pilula: 'Descanso pausado' },
  done:    { rotulo: 'Descanso terminado', botao: 'Recomeçar descanso', pilula: 'Descanso terminado' },
};
let audioCtx = null;

function restoAtual() {
  if (T.state === 'running') return Math.max(0, (T.endAt - Date.now()) / 1000);
  if (T.state === 'paused') return T.restante;
  if (T.state === 'done') return 0;
  const e = exAberto();
  return e?.sets.length && !ehCardio(e) ? descansoApos(e, serieDoDescanso(e)) : DESCANSO_PADRAO;
}
// Série cujo descanso vale agora: a última marcada como feita (ou a primeira, se nenhuma foi feita)
const serieDoDescanso = e => [...e.sets].reverse().find(s => s.feita) || e.sets[0];

// Único ponto que muda o estado do cronômetro: liga ou desliga o relógio e redesenha
function definirTimer(state, campos = {}) {
  Object.assign(T, campos, { state });
  clearInterval(T.intervalo);
  if (state === 'running') T.intervalo = setInterval(tick, 200);
  atualizarTimerUI();
}

// Sem descanso (0, no bi-set), o cronômetro fica parado
function iniciarDescanso(e, segundos = descansoApos(e, serieDoDescanso(e))) {
  if (!(segundos > 0)) return zerar();
  desbloquearAudio();
  definirTimer('running', { exId: e.id, total: segundos, endAt: Date.now() + segundos * 1000 });
}

function tick() {
  if (T.state !== 'running') return;
  if (Date.now() >= T.endAt) terminarDescanso(); else atualizarTimerUI();
}

function terminarDescanso() {
  definirTimer('done');
  alarme();
  if (!$('#timer')) toast('Descanso terminado'); // sem o cronômetro na tela (lista ou janela de cardio)
}

function playPause() {
  if (T.state === 'running') definirTimer('paused', { restante: restoAtual() });
  else if (T.state === 'paused') { desbloquearAudio(); definirTimer('running', { endAt: Date.now() + T.restante * 1000 }); }
  else if (exAberto()) iniciarDescanso(exAberto());
}

function zerar() { definirTimer('idle'); }

function ajustarDescanso(d) {
  const e = exAberto();
  if (T.state === 'running' || T.state === 'paused') {
    const r = Math.max(0, restoAtual() + d);
    const total = Math.max(1, T.total + d, r);
    if (r === 0) terminarDescanso();
    else if (T.state === 'running') definirTimer('running', { total, endAt: Date.now() + r * 1000 });
    else definirTimer('paused', { total, restante: r });
  } else if (e) {
    // Parado: muda o descanso do tipo da série da vez (A, P ou T) neste exercício e guarda no treino
    const tipo = tipoSerie(serieDoDescanso(e));
    guardarDescanso(e, tipo, descansoDe(e, serieDoDescanso(e)) + d);
    definirTimer('idle');
  }
}

function atualizarTimerUI() {
  const resto = restoAtual();
  const txt = TIMER_TXT[T.state];
  const box = $('#timer');
  if (box) {
    box.className = 'timer ' + T.state;
    $('#timer-time').textContent = fmtTempo(resto);
    $('#timer-label').textContent = txt.rotulo;
    $('#timer-btn').textContent = txt.botao;
    const fracao = T.state === 'running' || T.state === 'paused' ? resto / T.total : 1;
    $('#ring-prog').setAttribute('stroke-dashoffset', String(100 - 100 * fracao));
  }
  const pill = $('#timer-pill');
  if (pill) {
    pill.hidden = T.state === 'idle' || !exSessao(T.exId);
    pill.className = 'timer-pill ' + T.state;
    pill.dataset.id = T.exId || '';
    $('#pill-label').textContent = txt.pilula;
    $('#pill-time').textContent = T.state === 'done' ? '' : fmtTempo(resto);
  }
}

function desbloquearAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { audioCtx = null; }
}

function alarme() {
  // O navegador só permite vibrar depois que a pessoa tocou na página
  if (navigator.userActivation?.hasBeenActive !== false) navigator.vibrate?.([250, 120, 250, 120, 400]);
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [0, 0.28, 0.56].forEach((d, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + d); o.stop(t0 + d + 0.25);
  });
}

/* ---------- Ações de treino ---------- */
function iniciarTreino(id) {
  const t = treinoPorId(id);
  if (!t) return;
  const itens = t.exercicios.filter(nomeado);
  if (!itens.length) { toast('Dê nome a pelo menos um exercício deste treino.'); return; }
  const achar = indiceBiblioteca(S);
  S.sessao = {
    treinoId: t.id, nome: t.nome.trim() || 'Treino', inicio: Date.now(),
    // Uma cópia de cada item do treino (meta, descansos, séries A e P, F, bi-set e observação), mais exId:
    // o exercício da Biblioteca, que guarda os dados de todos os treinos em que ele aparece
    exercicios: itens.map(e => ({ ...e, ...(!ehCardio(e) && { nome: e.nome.trim() }), exId: achar(e).id, feito: false, sets: [] })),
  };
  // Musculação começa com as séries de trabalho do plano (as de aquecimento e preparação entram ao abrir o exercício);
  // o cardio, com tantos trechos quanto da última vez (no mínimo um)
  for (const e of S.sessao.exercicios) {
    const anteriores = ultimasSeries(e.exId);
    const n = ehCardio(e) ? Math.max(1, anteriores.length) : e.series;
    for (let i = 0; i < n; i++) e.sets.push(novaLinha(e, i, anteriores));
  }
  zerar();
  salvarAgora();
  render(true);
}

async function concluirTreino() {
  const s = S.sessao;
  const exs = s.exercicios.map(e => {
    const series = e.sets.filter(x => x.feita).map(({ feita, ...linha }) => linha);
    // Cardio guarda o peso e a altura do dia, para as calorias do histórico não mudarem depois
    return ehCardio(e)
      ? { exId: e.exId, tipo: 'cardio', aparelho: e.aparelho, meta: e.meta, series, corpo: corpoAtual() }
      : { exId: e.exId, nome: e.nome, metaSeries: e.series, metaReps: e.reps, series };
  }).filter(e => e.series.some(ehTrabalho)); // só aquecimento e preparação não vira registro
  if (!exs.length) {
    const ok = await confirmar({ titulo: 'Nada registrado', texto: 'Para salvar o treino, marque pelo menos uma série de trabalho (T) ou um trecho de cardio como feito. Quer descartar este treino?', ok: 'Descartar treino', perigo: true });
    if (ok) comDesfazer('Treino descartado', () => { S.sessao = null; zerar(); });
    return;
  }
  const faltam = s.exercicios.filter(e => !e.feito).length;
  if (faltam) {
    const ok = await confirmar({ titulo: 'Concluir treino?', texto: `${faltam === 1 ? 'Falta' : 'Faltam'} ${plural(faltam, 'exercício', 'exercícios')}. As séries já marcadas serão salvas no histórico.`, ok: 'Concluir treino' });
    if (!ok) return;
  }
  const planejadas = s.exercicios.reduce((a, e) => a + (ehCardio(e) ? 0 : e.series), 0);
  const cardioPlanejados = s.exercicios.filter(ehCardio).length;
  S.historico.unshift({ id: uid(), treinoId: s.treinoId, nome: s.nome, inicio: s.inicio, fim: Date.now(), planejadas, cardioPlanejados, exercicios: exs });
  // O primeiro treino de musculação do programa em uso (não um começado antes da troca, nem só de cardio) abre a semana 1
  if (!S.programa.inicio && treinoPorId(s.treinoId) && exs.some(e => !ehCardio(e))) S.programa.inicio = +inicioDoDia(s.inicio);
  S.sessao = null;
  zerar();
  salvarAgora();
  render(true);
  toast('Treino concluído e salvo no histórico');
  fazerBackup({ avisarErro: true }); // vai para o Drive na hora (se estiver conectado)
}

async function cancelarTreino() {
  const ok = await confirmar({ titulo: 'Cancelar treino?', texto: 'As séries registradas neste treino serão descartadas.', ok: 'Cancelar treino', perigo: true });
  if (ok) comDesfazer('Treino cancelado', () => { S.sessao = null; zerar(); });
}

/* ---------- Ações do editor ---------- */
function novoTreino() {
  const usados = new Set(S.treinos.map(t => t.nome));
  const letra = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].find(c => !usados.has(`Treino ${c}`)) || '';
  const t = { id: uid(), nome: `Treino ${letra}`.trim(), dias: [], exercicios: [novoExercicio()] };
  S.treinos.push(t);
  salvarAgora();
  ui.tab = 'treinos';
  render(true);
  const card = document.querySelector(`[data-treino="${CSS.escape(t.id)}"]`);
  card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card?.querySelector('[data-f="e-nome"]')?.focus({ preventScroll: true });
}

// Novo exercício (foco no nome) ou novo cardio (foco na escolha do aparelho, sem abrir o teclado)
function adicionarItem(tid, item) {
  const t = treinoPorId(tid);
  if (!t) return;
  t.exercicios.push(item);
  salvarAgora();
  render();
  const id = CSS.escape(item.id);
  document.querySelector(ehCardio(item) ? `[data-act="aparelho"][data-id="${id}"][aria-pressed="true"]` : `[data-f="e-nome"][data-id="${id}"]`)?.focus();
}

function escolherAparelho(tid, id, aparelho, botao) {
  const e = exDoTreino(tid, id);
  if (!e || !APARELHOS[aparelho]) return;
  e.aparelho = aparelho;
  botao.parentElement.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === botao)));
  salvar();
}

// Programas salvos: voltar a usar (os treinos de agora ficam salvos no lugar) e apagar
async function usarPrograma(id) {
  const p = programaPorId(id);
  if (!p) return;
  const ok = await confirmar({
    titulo: `Usar ${p.nome || 'este programa'}?`,
    texto: 'Os treinos de agora vão para Programas salvos, e os deste programa entram no lugar. O histórico não muda.',
    ok: 'Usar este programa',
  });
  if (!ok) return;
  comDesfazer(`${p.nome || 'Programa'} em uso`, () => {
    const antes = S.treinos;
    guardarPrograma(S);
    S.programas = S.programas.filter(x => x !== p);
    S.treinos = p.treinos;
    S.programa = { nome: p.nome, inicio: p.inicio };
    arquivarQueSaiu(S, antes);
  });
}
function apagarPrograma(id) {
  const p = programaPorId(id);
  if (p) comDesfazer(`${p.nome || 'Programa'} apagado`, () => { S.programas = S.programas.filter(x => x !== p); });
}

function alternarDia(tid, d, botao) {
  const t = treinoPorId(tid);
  if (!t) return;
  t.dias = t.dias.includes(d) ? t.dias.filter(x => x !== d) : [...t.dias, d];
  botao.setAttribute('aria-pressed', String(t.dias.includes(d)));
  salvar();
}

/* ---------- Backup ---------- */
function baixarArquivo(nome, conteudo, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// O mesmo formato vale para o arquivo exportado e para o backup no Google Drive
const pacoteBackup = dados => ({ app: 'planner-treino', exportadoEm: new Date().toISOString(), dados });
function exportar() {
  baixarArquivo(`planner-treino-backup-${hojeISO()}.json`, JSON.stringify(pacoteBackup(S), null, 2), 'application/json');
  toast('Backup exportado');
}

// Texto dos diálogos de importar e de restaurar ("de" diz de onde vêm os dados)
const trocaDados = (de, d) => `Os treinos, o histórico e os pesos deste aparelho serão trocados pelos ${de}: ${plural(d.treinos.length, 'treino', 'treinos')}, ${plural(d.historico.length, 'registro', 'registros')} e ${plural(d.pesos.length, 'peso', 'pesos')}.`;

const avisoPrograma = (bruto, d) => antesDoPrograma(bruto) && d.programas.length ? '. Os treinos dele estão em Programas salvos, e entrou o programa novo' : '';
const avisoNoDialogo = bruto => antesDoPrograma(bruto) ? ' Ele é de antes do programa novo: os treinos dele vão para Programas salvos, e o programa novo entra no lugar.' : '';

// Troca os dados deste aparelho pelos de um backup (arquivo ou Drive), com "Desfazer"
function aplicarBackup(d, msg) {
