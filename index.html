<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1815">
<title>Planner de treino</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin>
<style>
:root{
  /* Grafite com um toque quente (sem azul) */
  --bg:#1A1815; /* mesma cor na meta theme-color, no manifest.json e em --bg-glass */
  --surface:#24221F; --raised:#312E2A; --raised-hover:#3D3935; --line:#3D3A35;
  --bg-glass:rgba(26,24,21,.88); --surface-glass:rgba(36,34,31,.97); --scrim:rgba(7,6,5,.72);
  --text:#F3F0ED; --muted:#9D9790; --placeholder:#7F7972;
  /* Cor principal: laranja tangerina (botões de ação, logo, foco, aba ativa) */
  --accent:#FF933F; --accent-hover:#FFA963; --accent-ink:#381706;
  /* Vermelho de apagar puxado para o rosado, para não se confundir com o laranja */
  --ok:#45D19A; --ok-ink:#06261A; --danger:#FE4F75;
  /* Cor secundária: amarelo (descanso, em andamento, prioridade, seleções) */
  --second:#FFD23F; --second-ink:#2B2300; --second-soft:rgba(255,210,63,.14);
  /* Calendário: rampa de um tom só (amarelo), validada contra o painel #24221F */
  --heat-0:var(--raised); --heat-1:#7A6324; --heat-2:#A8862A; --heat-3:#D9AE2A; --heat-4:var(--second);
  /* Superfície clara invertida (avisos e dica do calendário) */
  --inv-bg:var(--text); --inv-ink:var(--bg); --inv-muted:#59544E; --inv-accent:#9E4500; --inv-hover:#EBE3DB;
  /* Linhas dos gráficos da Biblioteca: média (e gráficos de uma linha), máxima, mínima.
     Validadas para daltonismo e contraste no painel #24221F (validate_palette.js --mode dark --pairs all) */
  --s1:#E16C10; --s2:#29A288; --s3:#4C8EDF;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --nav-h:64px;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Barra do topo e navegação (vira menu inferior no celular) */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:900px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.brand-nome{white-space:nowrap}
/* Telas médias: o menu de 5 abas ocupa o espaço, fica só o ícone do app */
@media (max-width:899px){.brand-nome{display:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.nav{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px}
.nav button{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:color .15s,background .15s}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{background:var(--raised);color:var(--text)}
.instalar{margin-left:auto;background:var(--second);color:var(--second-ink)}

/* Páginas */
.page{max-width:760px;margin:0 auto;padding:28px 24px 48px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--muted);font-weight:500;font-size:14px}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.section-title{font-size:15px;color:var(--muted);margin-top:4px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px}
.empty{align-items:flex-start;gap:10px}
.hint{font-size:13px;color:var(--muted)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--r-md);font-weight:700;font-size:15px;white-space:nowrap;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--raised)}
.btn.ghost:hover{background:var(--raised-hover)}
.btn.danger{background:var(--danger);color:#2B0A10}
.btn.small{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.text-danger{background:none;color:var(--danger);align-self:flex-start;padding:0 6px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--raised);color:var(--text)}
.icon-btn.danger:hover{color:var(--danger)}
.add-btn{width:100%;height:44px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-weight:600;transition:border-color .15s,color .15s}
.add-btn:hover{border-color:var(--second);color:var(--text)}
.add-btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sets .dupla{margin-top:6px}

/* Campos */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.field{width:100%;min-width:0;height:44px;background:var(--raised);border:1.5px solid transparent;border-radius:var(--r-sm);padding:0 12px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--placeholder)}
/* Nas séries, o valor apagado é o da última vez: some ao tocar no campo, para digitar o novo */
.set-row .field:focus::placeholder{color:transparent}
/* RIR com o botão "ainda dava para fazer muito mais" ao lado (sinal para subir a carga) */
.com-marca{display:flex;gap:4px;min-width:0}
.com-marca .field{flex:1}
.marca-mais{flex:none;width:30px;height:44px;border-radius:var(--r-sm);background:var(--raised);color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.marca-mais:hover{color:var(--text)}
.marca-mais[aria-pressed="true"]{background:var(--second);color:var(--second-ink)}
.aviso-mais{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--second-soft);font-size:13px;line-height:1.4}
.aviso-mais svg,.mais-hist{flex:none;color:var(--second)}
.mais-hist{display:inline-grid;vertical-align:-2px;margin-left:4px}
.hint svg{vertical-align:-2px}
.field.num{text-align:center;font-size:21px;font-weight:600;padding:0 4px}
select.field{appearance:none;-webkit-appearance:none;cursor:pointer;padding:0 26px 0 12px;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}

/* Hoje */
.tc-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tc-ex li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tc-ex li:first-child{border-top:0;padding-top:0}
.tc-ex .num{font-size:19px;color:var(--muted);flex:none}
.row-list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:12px 12px 12px 16px}
.row-main{display:flex;flex-direction:column;min-width:0}
.row-main b{font-weight:700}

/* Treino em andamento */
.progress{display:flex;flex-direction:column;gap:8px}
.bar-track{height:8px;background:var(--raised);border-radius:99px;overflow:hidden}
.bar-track span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.ex-list{display:flex;flex-direction:column;gap:10px}
.ex-item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1.5px solid transparent;transition:border-color .15s}
.ex-item:hover{border-color:var(--line)}
.status-ic{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line)}
.ex-item.andamento .status-ic{border-color:var(--second)}
.ex-item.andamento .status-ic::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--second)}
.ex-item.feito .status-ic{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-meta{font-size:13px;color:var(--muted)}
.ex-side{font-size:21px;font-weight:600;color:var(--muted);flex:none}
.ex-item.feito .ex-side{color:var(--ok)}
.timer-pill{display:flex;align-items:center;gap:10px;align-self:flex-start;height:40px;padding:0 16px;border-radius:99px;background:var(--second-soft);color:var(--second);font-weight:700}
.timer-pill .num{font-size:21px}
.timer-pill.done{background:rgba(69,209,154,.14);color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn.primary{flex:1}

/* Editor de treinos */
.ec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 40px;gap:10px;align-items:end}
.ec-head .icon-btn{margin-bottom:2px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.opt{height:40px;border-radius:10px;background:var(--raised);color:var(--muted);font-weight:600;font-size:13px;transition:background .15s,color .15s}
.opt[aria-pressed="true"]{background:var(--second);color:var(--second-ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .opt{height:44px}
.ex-edit-list{display:flex;flex-direction:column;gap:10px}
.ex-edit{display:grid;grid-template-columns:minmax(0,1fr) 84px 140px 40px 40px;gap:10px;align-items:end;padding:12px;background:var(--bg);border-radius:var(--r-md)}
.ex-edit .icon-btn{margin-bottom:2px}
.cardio-edit .meta{grid-column:2 / 5}
.field.limpa{text-align:center;font-family:var(--num);font-size:19px;font-weight:600;padding:0 6px}
.prio[aria-pressed="true"],.prio[aria-pressed="true"]:hover{color:var(--second)}
.prio[aria-pressed="true"] svg{fill:currentColor}
/* Musculação no editor: em cima nome, séries, repetições, prioridade e remover; embaixo (ex-mais) as séries A e P,
   o descanso T, a observação, o F e o bi-set */
.ex-mais{grid-column:1 / -1;display:grid;grid-template-columns:150px 104px minmax(0,1fr) 40px 40px;grid-template-areas:"plano desc obs falha biset";gap:10px;align-items:end}
.ex-mais .plano{grid-area:plano}
.ex-mais .descanso{grid-area:desc}
.ex-mais .obs{grid-area:obs}
.ex-mais .falha{grid-area:falha}
.ex-mais .biset{grid-area:biset}
/* F e bi-set ligados: fundo amarelo claro, como as etiquetas */
.marca.falha{font-size:21px;font-weight:600}
.marca[aria-pressed="true"],.marca[aria-pressed="true"]:hover{background:var(--second-soft);color:var(--second)}
/* Os dois exercícios de um bi-set ficam ligados por uma faixa amarela à esquerda */
.ex-edit.em-par{box-shadow:inset 3px 0 0 var(--second)}
.programa-campos{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;margin-left:8px;border-radius:99px;background:var(--second-soft);color:var(--second);font:700 11.5px/1 Manrope,system-ui,sans-serif;vertical-align:middle;white-space:nowrap}
.tag.cinza{background:var(--raised);color:var(--text)}

/* Calendário de treinos e gráficos de linha (Biblioteca): painel, título e o desenho em si */
.cal,.grafico{gap:14px}
.cal h2+p,.grafico h2+p{margin-top:2px}
.filtros{display:flex;gap:4px;align-self:flex-start;background:var(--bg);padding:4px;border-radius:12px;max-width:100%}
.filtros button{height:32px;min-width:44px;padding:0 10px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px;transition:background .15s,color .15s}
.filtros button:hover{color:var(--text)}
.filtros button[aria-pressed="true"]{background:var(--second);color:var(--second-ink)}
.heat{position:relative;min-height:80px}
.heat svg,.graf svg{display:block;max-width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;animation:fade .25s}
.heat svg:focus,.graf svg:focus{outline:none}
.heat svg:focus-visible,.graf svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.heat text,.graf text{fill:var(--muted);font:600 11px Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.heat rect.ativo{stroke:var(--text);stroke-width:1.5px}
.h0{--c:var(--heat-0)} .h1{--c:var(--heat-1)} .h2{--c:var(--heat-2)} .h3{--c:var(--heat-3)} .h4{--c:var(--heat-4)}
.heat rect{fill:var(--c)}
.dica{position:absolute;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:2px;min-width:150px;max-width:240px;padding:9px 12px;border-radius:12px;background:var(--inv-bg);color:var(--inv-ink);font-size:13px;line-height:1.35;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.dica b{font-weight:800;font-size:14px}
.dica .data{color:var(--inv-muted)}
.dica .val{display:flex;align-items:center;gap:6px;color:var(--inv-muted)}
.dica .val b{font-size:14px;color:var(--inv-ink)}
/* Chave de linha (na legenda e na dica): um traço curto na cor da série */
.dica i,.legenda-linhas i{display:inline-block;flex:none;width:14px;height:3px;border-radius:2px;background:var(--c)}
.legenda,.legenda-linhas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legenda span,.legenda-linhas span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--c)}

/* Gráficos de linha (Biblioteca) */
.graf{position:relative;min-height:60px}
.graf .grade{stroke:var(--line);stroke-width:1}
.graf .linha{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.graf .ponto{stroke:var(--surface);stroke-width:2}
.graf .mira{stroke:var(--muted);stroke-width:1}

/* Biblioteca */
.busca{height:46px}
.lib-lista{display:flex;flex-direction:column;gap:12px}
.lib-item{width:100%;text-align:left;transition:background .15s}
.lib-item:hover{background:var(--raised)}
.lib-item .row-main{flex:1}
.lib-item.arquivado .row-main b{color:var(--muted)}
.voltar{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;height:36px;padding:0 10px 0 4px;border-radius:10px;color:var(--muted);font-weight:700;font-size:14px}
.voltar:hover{color:var(--text);background:var(--surface)}
.ex-cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ex-titulo{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:4px}
/* O nome do exercício é editável na própria página: parece título, com um traço embaixo */
.titulo-edit{width:100%;min-width:0;background:none;border:0;border-bottom:1.5px solid var(--line);padding:2px 0 4px;outline:none;font:800 28px/1.15 Manrope,system-ui,sans-serif;letter-spacing:-.02em;color:var(--text);transition:border-color .15s}
.titulo-edit:hover{border-color:var(--muted)}
.titulo-edit:focus{border-color:var(--accent)}
.registro{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.registro h3 .small{font-weight:600;margin-left:6px}

/* Histórico */
.hist{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.hist-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px;text-align:left}
.hist-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hist-main b{font-weight:700;font-size:16px}
.hist-stats{display:flex;gap:16px;text-align:right}
.hist-stats span{font-size:12px;color:var(--muted);line-height:1.1}
.hist-stats b{display:block;font-family:var(--num);font-size:22px;font-weight:600;color:var(--text)}
.chev{color:var(--muted);transition:transform .2s;display:grid}
.hist-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.hist-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.hist-ex h3{font-size:15px;font-weight:700;margin-bottom:6px}
.hist-sets li{display:grid;grid-template-columns:24px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;font-family:var(--num);font-size:18px;padding:3px 0}
.backup{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.backup>div:first-child{flex:1 1 260px;display:flex;flex-direction:column;gap:4px}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap}
a.btn{color:inherit;text-decoration:none}

/* Backup no Google Drive */
.panel-texto{display:flex;flex-direction:column;gap:4px}
.conta{overflow-wrap:anywhere}
.drive-conectar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.drive-conectar .fld{flex:1 1 280px}
.drive-conectar .btn{height:44px}
.drive-sit{display:flex;gap:12px;align-items:flex-start;background:var(--raised);border-radius:var(--r-md);padding:12px 14px}
.drive-sit>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.drive-sit p{overflow-wrap:anywhere}
.drive-ponto{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ok)}
.drive-sit[data-st="enviando"] .drive-ponto,.drive-sit[data-st="pendente"] .drive-ponto{background:var(--accent)}
.drive-sit[data-st="offline"] .drive-ponto{background:var(--muted)}
.drive-sit[data-st="erro"] .drive-ponto,.drive-sit[data-st="conflito"] .drive-ponto{background:var(--danger)}
/* Ponto na aba Ajustes quando o backup precisa de atenção (falhou ou há backup de outro aparelho) */
.nav button[data-alerta]{position:relative}
.nav button[data-alerta]::after{content:'';position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* Janela do exercício */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:32px}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim);animation:fade .25s}
.sheet{position:relative;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-title{min-width:0}
.sheet-title h2{font-size:22px;outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.sets-col{display:flex;flex-direction:column;gap:12px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-grid{display:grid;grid-template-columns:var(--c1,32px) repeat(var(--n,3),minmax(0,1fr)) 44px;gap:8px;align-items:center;padding:0 6px}
.sets-head{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.set-row{padding:6px;border-radius:14px;transition:background .2s}
.set-row.done{background:rgba(69,209,154,.09)}
.set-n{font-size:21px;font-weight:600;color:var(--muted);text-align:center}
/* Musculação: a letra do tipo de série (A, P, T) e, embaixo, o descanso depois dela (toque para mudar) */
.set-lado{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.set-tipo{font-size:20px;font-weight:600;line-height:1;color:var(--text)}
.set-row.preparo .set-tipo{color:var(--muted)}
/* Última série de trabalho de um exercício com F (da semana 3 em diante): vai até a falha */
.set-row.falha .set-tipo{color:var(--accent)}
.set-tipo .f{font-size:12px;vertical-align:super;margin-left:1px}
/* Lembretes do exercício (bi-set, F e observação) no topo da janela */
.notas-ex{display:flex;flex-direction:column;gap:4px;padding:10px 12px 10px 28px;border-radius:12px;background:var(--raised);font-size:13px;line-height:1.4;list-style:disc}
.notas-ex li::marker{color:var(--second)}
.desc{display:flex;align-items:center;gap:2px;min-height:24px;padding:0 3px;border-radius:6px;font-size:12px;color:var(--muted);cursor:text}
.desc:hover{background:var(--raised)}
.desc svg{flex:none}
.desc input{width:3.2ch;padding:0;background:none;border:0;border-bottom:1px solid var(--line);outline:none;color:var(--text);font-size:12px;font-weight:600;text-align:right}
.desc input:focus{border-color:var(--accent)}
.desc input::placeholder{color:var(--placeholder)}
.legenda-series{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.legenda-series div{display:flex;gap:8px}
.legenda-series dt{flex:none;width:14px;font-family:var(--num);font-weight:600;color:var(--text)}
.hist-sets li.preparo{color:var(--muted)}
.grupo-ex{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted)}
.grupo-ex .field{width:auto;min-width:170px;height:38px}
.check{width:44px;height:44px;border-radius:12px;background:var(--raised);color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.check:hover{color:var(--text)}
.set-row.done .check{background:var(--ok);color:var(--ok-ink)}
.sheet-foot{padding:16px 20px;border-top:1px solid var(--line)}

/* Cronômetro de descanso */
/* O quadro do cronômetro (musculação) e o da calculadora (cardio) ocupam o mesmo lugar na janela */
.timer,.calc{background:var(--bg);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px}
.timer{align-items:center}
.ring-wrap{position:relative;width:200px;height:200px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:var(--raised)}
.ring .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.timer.running .prog,.timer.paused .prog{stroke:var(--second)}
.timer.paused .prog{opacity:.55}
.timer.done .prog{stroke:var(--ok)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.timer-label{font-size:13px;font-weight:600;color:var(--muted)}
.timer-time{font-size:66px;font-weight:600;line-height:1}
.timer.paused .timer-time{opacity:.6}
.timer.done .timer-time,.timer.done .timer-label{color:var(--ok)}
.timer.done .ring-wrap{animation:pulse .9s ease-in-out 3}
.adj{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.adj button{height:42px;border-radius:12px;background:var(--raised);font-family:var(--num);font-size:19px;font-weight:600;transition:background .15s}
.adj button:hover{background:var(--raised-hover)}
.timer-actions{display:flex;gap:8px;width:100%}
.timer-actions .btn.primary{flex:1}

/* Cardio: trechos e calculadora */
.trecho-calc{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:0 2px 2px;font-size:13px;color:var(--muted)}
.trecho-calc:empty{display:none}
.trecho-calc b{font-family:var(--num);font-size:18px;font-weight:600;color:var(--text)}
.tag.neutro{margin-left:0;background:var(--raised);color:var(--text)}
.calc-col{display:flex;flex-direction:column;gap:12px}
.calc h3{font-size:15px;font-weight:700}
.calc small{font:600 13px/1 Manrope,system-ui,sans-serif;color:var(--muted);margin-left:4px}
.kcal{display:flex;flex-direction:column;gap:4px}
.kcal span,.stat span{font-size:12px;font-weight:600;color:var(--muted)}
.kcal b{font-size:46px;font-weight:600;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stats.quatro{grid-template-columns:repeat(4,minmax(0,1fr))}
/* Aba Peso: campo do peso, dia e botão numa linha (no celular, o botão embaixo); na lista, o peso dá para corrigir */
.peso-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.peso-form .btn{height:44px}
.peso-linha .row-main{flex:1}
.peso-edit{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.peso-edit .field{width:88px;height:40px;font-size:19px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--surface);border-radius:12px;padding:10px 12px}
.stat b{font-size:23px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corpo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Avisos e diálogos próprios */
#toast-root{position:fixed;left:0;right:0;bottom:24px;z-index:80;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:480px;background:var(--inv-bg);color:var(--inv-ink);font-weight:600;padding:12px 18px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.4);animation:toastIn .25s cubic-bezier(.2,.8,.2,1)}
.toast.has-action{padding:8px 8px 8px 18px}
.toast-btn{color:var(--inv-accent);font-weight:800;padding:8px 12px;border-radius:10px}
.toast-btn:hover{background:var(--inv-hover)}
.dlg-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.dlg-backdrop{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.dlg{position:relative;width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;animation:sheetUp .25s cubic-bezier(.2,.8,.2,1)}
.dlg p{color:var(--muted)}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.dlg-actions.empilhar{flex-direction:column;align-items:stretch}
.dlg-texto{display:flex;flex-direction:column;gap:8px}

/* Animações de entrada */
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px)}}
@keyframes fade{from{opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
@keyframes pulse{50%{transform:scale(1.04)}}
.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1)}

/* Celular */
@media (max-width:719px){
  .topbar{position:static;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .bar{padding:0}
  .brand{display:none}
  .instalar{margin:14px 16px 0 auto}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--surface-glass);border-top:1px solid var(--line)}
  .nav button{flex:1;min-width:0;flex-direction:column;gap:2px;height:auto;padding:6px 2px;font-size:12px;border-radius:12px}
  .titulo-edit{font-size:25px}
  .nav button[aria-current="page"]{background:none;color:var(--accent)}
  .nav button[data-alerta]::after{top:4px;right:auto;left:calc(50% + 8px)}
  main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  .page{padding:20px 16px 24px;gap:16px}
  h1{font-size:25px}
  .panel{padding:16px;gap:14px;border-radius:16px}
  .ec-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .ex-edit{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .ex-edit .name{grid-column:1 / 3}
  .ex-edit .del{grid-column:3;grid-row:1}
  .cardio-edit .meta{grid-column:1 / 3}
  .ex-mais{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;grid-template-areas:"plano desc falha" "obs obs biset"}
  .stats.quatro{grid-template-columns:repeat(2,minmax(0,1fr))}
  .peso-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .peso-form .btn{grid-column:1 / -1}
  .sheet-wrap{padding:0}
  .sheet{width:100%;height:100%;border-radius:0}
  .sheet-head{padding:10px 12px 10px 6px}
  .sheet-body{grid-template-columns:minmax(0,1fr);padding:14px 16px;gap:16px}
  .sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .ring-wrap{width:172px;height:172px}
  .timer-time{font-size:58px}
  .timer,.calc{padding:16px;gap:14px}
  .kcal b{font-size:40px}
  #toast-root{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <div class="brand"><span class="brand-mark" id="brand-mark"></span><span class="brand-nome">Planner de treino</span></div>
    <button class="btn small instalar" id="instalar" data-act="instalar" hidden>Instalar app</button>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
  </div>
</header>
<main id="view"></main>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
'use strict';

/* ---------- Constantes e utilidades ---------- */
const KEY = 'planner-treino:v1';
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGO = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const SEMANA = [1,2,3,4,5,6,0]; // começa na segunda
const DESCANSO_PADRAO = 120; // depois de uma série de trabalho (T): 1,5 a 3 min
const DESCANSO_PREPARO = 40; // depois de uma série de aquecimento (A) ou de preparação (P): 30 a 40 s

const ICONS = {
  hoje: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  treinos: '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  historico: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  lixo: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  voltar: '<path d="M15 5l-7 7 7 7"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  baixar: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  estrela: '<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
  biblioteca: '<rect x="3.5" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="16" rx="1"/><path d="M16.6 5.4l3.3-.9 3.1 14.6-3.3.9z"/>',
  ajustes: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  arquivo: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/>',
  mais: '<path d="M7 12l5-5 5 5M7 18l5-5 5 5"/>',
  biset: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  peso: '<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.5 10.5a3.5 3.5 0 0 1 7 0M12 10.5l1.6-2.2"/>',
};
const icon = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vazio = v => v === '' || v == null;
const clampInt = (v, min, max, def) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
const fmtNum = v => vazio(v) ? '' : String(v).replace('.', ',');
const fmtTempo = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtHora = ts => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const anoCurto = d => String(d.getFullYear()).slice(2);
const fmtData = ts => {
  const d = new Date(ts);
  const ano = d.getFullYear() !== new Date().getFullYear() ? ` ${anoCurto(d)}` : '';
  return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}${ano}`;
};
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
// Séries de trabalho num registro do histórico (só musculação; aquecimento e preparação não contam no volume)
const seriesFeitas = h => h.exercicios.reduce((a, e) => a + (ehCardio(e) ? 0 : e.series.filter(ehTrabalho).length), 0);
const diasTxt = dias => dias.length ? SEMANA.filter(d => dias.includes(d)).map(d => DIAS[d]).join(', ') : 'Sem dia definido';
const fmtDiaMes = ts => {
  const d = new Date(ts);
  return `${d.getDate()} ${MESES[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ` ${anoCurto(d)}` : ''}`;
};
const pad2 = n => String(n).padStart(2, '0');
const dataISO = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const hojeISO = () => dataISO(Date.now());
const DIA_MS = 864e5;
const inicioDoDia = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d; }; // meia-noite do dia (Date)
const diasDesde = ts => Math.round((inicioDoDia(Date.now()) - inicioDoDia(ts)) / DIA_MS); // 0 hoje, 1 ontem…
// "2026-11-23" (campo de data) vira a meia-noite desse dia aqui; texto inválido vira null
const lerDataISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? +new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const temChave = (tabela, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(tabela, k);
const NUM0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const NUM1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const NUM2 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
const fmtKg = v => `${NUM2.format(v)} kg`;
const VEL = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const aprox = (v, fmt = NUM0) => v == null ? '–' : `≈ ${fmt.format(v)}`;
const comUnidade = (v, u) => vazio(v) ? '–' : `${fmtNum(v)} ${u}`;
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---------- Campos das séries (musculação) e dos trechos (cardio) ---------- */
// Bicicleta ergométrica: METs do Compendium of Physical Activities por esforço
const ESFORCOS = { leve: { nome: 'Leve', met: 4.8 }, moderado: { nome: 'Moderado', met: 6.8 }, forte: { nome: 'Forte', met: 8.8 } };
// Tempo como no painel ("15:30") ou em minutos com vírgula (15,5)
const lerTempo = s => {
  if (!s.includes(':')) return parseFloat(s.replace(',', '.'));
  const [m, seg] = s.split(':');
  return (parseInt(m, 10) || 0) + (parseInt(seg, 10) || 0) / 60;
};
// Altura em metros (1,75) ou centímetros (175); "17" ainda está sendo digitado e não vale
const lerAltura = s => { const n = parseFloat(s.replace(',', '.')); return n > 3 ? (n >= 100 ? n / 100 : NaN) : n; };
// Cada campo: rótulo, texto para leitor de tela, limite, se aceita vírgula, leitura especial ou lista de opções
const CAMPOS = {
  peso: { rotulo: 'Peso (kg)', aria: 'Peso em kg', max: 999, decimal: true },
  reps: { rotulo: 'Reps', aria: 'Repetições', max: 999 },
  rir: { rotulo: 'RIR', aria: 'RIR', max: 99, marca: true }, // marca: botão "ainda dava para fazer muito mais" ao lado
  km: { rotulo: 'Km', aria: 'Distância em km', max: 999, decimal: true },
  min: { rotulo: 'Tempo (min)', aria: 'Tempo em minutos', max: 999, decimal: true, ler: lerTempo, aceita: /[^\d.,:]/g,
    mostrar: v => Number.isInteger(v) ? fmtNum(v) : fmtTempo(v * 60) }, // 15,5 aparece como 15:30, igual ao painel
  incl: { rotulo: 'Incl. (%)', aria: 'Inclinação em %', max: 40, decimal: true },
  degraus: { rotulo: 'Degraus', aria: 'Degraus', max: 99999 },
  altura: { max: 2.5, decimal: true, ler: lerAltura },
  esforco: { rotulo: 'Esforço', aria: 'Esforço', opcoes: ESFORCOS, padrao: 'moderado' },
};
// Valor guardado: opção válida (ou a padrão), número dentro do limite, ou vazio
function lerCampo(k, v) {
  const c = CAMPOS[k];
  if (c.opcoes) return c.opcoes[v] ? v : c.padrao;
  if (vazio(v)) return '';
  const s = String(v);
  let n = c.ler ? c.ler(s) : c.decimal ? parseFloat(s.replace(',', '.')) : parseInt(s, 10);
  if (c.decimal) n = Math.round(n * 100) / 100;
  return Number.isFinite(n) && n >= 0 ? Math.min(n, c.max) : '';
}
// O que a pessoa pode digitar em cada campo numérico, e como o valor guardado aparece
const filtroDe = k => CAMPOS[k]?.aceita ?? (CAMPOS[k]?.decimal ? /[^\d.,]/g : /\D/g);
const mostrarCampo = (k, v) => vazio(v) ? '' : (CAMPOS[k]?.mostrar ?? fmtNum)(v);
const tempoTxt = v => vazio(v) ? '–' : `${mostrarCampo('min', v)} min`;

/* ---------- Cardio: aparelhos e calculadora ---------- */
// Calorias = MET × peso (kg) × horas. METs da esteira no plano: Compendium of Physical Activities
const MET_CAMINHADA = [[2, 2], [3.2, 2.8], [4, 3], [4.8, 3.5], [5.6, 4.3], [6.4, 5], [7.2, 7], [8, 8.3]]; // [km/h, MET]
const MET_CORRIDA = [[6.4, 6], [8, 8.3], [8.4, 9], [9.7, 9.8], [10.8, 10.5], [11.3, 11], [12.1, 11.5], [12.9, 11.8], [13.8, 12.3], [14.5, 12.8], [16.1, 14.5], [17.7, 16], [19.3, 19]];
const LIMITE_CORRIDA = 7;  // km/h: abaixo disso conta como caminhada
const DEGRAU_M = 0.2;      // altura de um degrau (m)
const DEGRAUS_ANDAR = 16;  // como no painel das escadas de academia

function interpolar(tabela, x) {
  const i = tabela.findIndex(([px]) => x <= px);
  if (i === 0) return tabela[0][1];
  if (i < 0) return tabela[tabela.length - 1][1];
  const [x0, y0] = tabela[i - 1], [x1, y1] = tabela[i];
  return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
}
const kcal = (met, peso, min) => peso > 0 ? met * peso * min / 60 : null;
const tipoEsteira = vel => vel < 5 ? 'Caminhada leve' : vel < LIMITE_CORRIDA ? 'Caminhada rápida' : vel < 9.5 ? 'Corrida leve' : vel < 12 ? 'Corrida' : 'Corrida forte';
const andares = degraus => degraus / DEGRAUS_ANDAR;

// Gráficos da Biblioteca: cada um lê um valor do dia de treino (no cardio, da conta somada dos trechos do dia)
const GRAF_TEMPO = { titulo: 'Tempo', sub: 'Minutos em cada dia de treino.', valor: c => c.min, fmt: tempoTxt };

// Cada aparelho: campos do trecho, textos de ajuda e a conta de um trecho (null se faltar dado; corpo = { peso, altura }).
// trecho, resumo, quadro e historico dizem como mostrar o resultado na linha, na lista, na calculadora e no histórico;
// graficos e recorde, o que aparece na página do aparelho na Biblioteca.
const APARELHOS = {
  esteira: {
    nome: 'Esteira', campos: ['km', 'min', 'incl'], usaAltura: true,
    dica: 'Copie km e tempo do painel. Tempo em minutos: 15,5 ou 15:30 é 15 min e 30 s. Inclinação 0 é esteira plana.',
    vazio: 'Preencha km e tempo de um trecho para ver velocidade, ritmo, calorias e passos.',

    conta({ km, min, incl }, { peso, altura }) {
      if (!(km > 0 && min > 0)) return null;
      const vel = km / min * 60, correndo = vel >= LIMITE_CORRIDA;
      // Inclinação: parte de subida das equações do ACSM (1,8 andando, 0,9 correndo × metros/min × rampa)
      const met = interpolar(correndo ? MET_CORRIDA : MET_CAMINHADA, vel) + (correndo ? 0.9 : 1.8) * (vel * 1000 / 60) * ((Number(incl) || 0) / 100) / 3.5;
      // Passos: andando, o passo vai de 30% a 55% da altura conforme a velocidade; correndo, ~160 a 180 passos/min
      const passos = !(altura > 0) ? null : correndo
        ? min * (150 + 1.6 * vel) * Math.sqrt(1.7 / altura)
        : km * 1000 / (altura * Math.min(0.55, Math.max(0.3, 0.18 + 0.05 * vel)));
      return { vel, ritmo: min / km, tipo: tipoEsteira(vel), kcal: kcal(met, peso, min), passos };
    },

    vazio: 'Preencha o tempo de um trecho para ver as calorias.',
    como: 'Estimativa pelo esforço e pelo seu peso.',
    conta: ({ min, esforco }, { peso }) => min > 0 ? { kcal: kcal(ESFORCOS[esforco].met, peso, min) } : null,
    trecho: () => '',
    resumo: (c, tempo) => tempo,
    quadro: (c, valor, tempo) => [tempo],
    historico: t => [tempoTxt(t.min), ESFORCOS[t.esforco].nome, ''],

    graficos: [

// Soma os trechos que têm conta; calorias e passos só quando todos esses trechos têm o dado
function contaCardio(e, trechos, corpo) {
  const contas = trechos.map(t => APARELHOS[e.aparelho].conta(t, corpo));
  const ok = trechos.filter((_, i) => contas[i]), validas = contas.filter(Boolean);
  const soma = lista => lista.reduce((a, v) => a + (Number(v) || 0), 0);
  const total = k => validas.length && validas.every(c => c[k] != null) ? soma(validas.map(c => c[k])) : null;
  return {
    contas, n: validas.length,
    min: soma(ok.map(t => t.min)), km: soma(ok.map(t => t.km)), degraus: soma(ok.map(t => t.degraus)),
    kcal: total('kcal'), passos: total('passos'),
  };
}

// Resumo do que foi feito, para a lista do treino ("2 km em 23 min")
function resumoCardio(e, trechos) {
  const c = contaCardio(e, trechos, {});
  return c.n ? APARELHOS[e.aparelho].resumo(c, tempoTxt(c.min)) : plural(trechos.length, 'trecho feito', 'trechos feitos');

// Um registro por exercício (pelo nome, sem diferenciar maiúsculas, acentos e espaços) ou por aparelho de cardio.
// Treinos e histórico apontam para ela: os dados de cada exercício ficam juntos, mesmo quando ele sai dos treinos.
const objetos = lista => Array.isArray(lista) ? lista.filter(x => x && typeof x === 'object') : [];
const chaveNome = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const nomeOuPadrao = e => String(e.nome ?? '').trim() || 'Sem nome';
const chaveDe = e => ehCardio(e) ? `cardio:${e.aparelho}` : `forca:${chaveNome(nomeOuPadrao(e))}`;
const exPorId = id => S.biblioteca.find(x => x.id === id);
// Item de treino que conta para a Biblioteca: cardio ou exercício com nome
const nomeado = e => ehCardio(e) || !!chaveNome(e.nome);
const forcaNomeada = e => !ehCardio(e) && nomeado(e);
// Itens com nome dos treinos (e, com salvos, também os dos Programas salvos)
function* itensNomeados(d, salvos = false) {
  const treinos = salvos ? [...d.treinos, ...d.programas.flatMap(p => p.treinos)] : d.treinos;
  for (const t of treinos) for (const e of t.exercicios) if (nomeado(e)) yield { t, e };
}

// Registro da Biblioteca de um item (de treino, da sessão, do histórico ou de um backup)
const registro = (x, id = uid(), arquivado = false) => ehCardio(x)
  ? { id, tipo: 'cardio', aparelho: APARELHOS[x.aparelho] ? x.aparelho : 'esteira', arquivado }
  : { id, nome: nomeOuPadrao(x), arquivado, grupo: grupoValido(x.grupo) ? x.grupo : grupoPeloNome(x.nome) };
// Índice por chave: acha o registro de um item e cria o que falta (novo = o registro a incluir, se já existe um)
function indiceBiblioteca(d) {
  const porChave = new Map(d.biblioteca.map(ex => [chaveDe(ex), ex]));
  return (item, novo) => {
    const chave = chaveDe(item);
    if (!porChave.has(chave)) { const ex = novo || registro(item); d.biblioteca.push(ex); porChave.set(chave, ex); }
    return porChave.get(chave);
  };
}
const exercicioDe = (d, item) => indiceBiblioteca(d)(item);

// Deixa a Biblioteca coerente com treinos, sessão e histórico (ao abrir o app e ao importar um backup)
function sincronizarBiblioteca(d, lista) {
  d.biblioteca = [];
  const achar = indiceBiblioteca(d), porId = new Map();
  for (const x of objetos(lista)) {
    const ex = registro(x, String(x.id || uid()), !!x.arquivado);
    porId.set(ex.id, achar(ex, ex)); // nomes repetidos viram um exercício só
  }
  for (const e of [...d.historico.flatMap(h => h.exercicios), ...(d.sessao?.exercicios || [])]) e.exId = (porId.get(e.exId) || achar(e)).id;
}

// Roda a cada gravação (e no fim de normalizar): todo exercício dos treinos tem registro (e nunca fica arquivado),
// e sai o que era só um nome digitado (sem registros, fora dos treinos e dos Programas salvos, e não arquivado).
// O de um programa salvo fica, com o grupo muscular escolhido, para quando o programa voltar a ser usado.
function podarBiblioteca(d) {
  const achar = indiceBiblioteca(d), emUso = new Set(), comDados = new Set();
  for (const { e } of itensNomeados(d)) emUso.add(achar(e));
  for (const h of d.historico) for (const e of h.exercicios) comDados.add(e.exId);
  for (const e of d.sessao?.exercicios || []) comDados.add(e.exId);
  const salvos = new Set([...itensNomeados(d, true)].map(({ e }) => chaveDe(e)));
  d.biblioteca = d.biblioteca.filter(ex => {
    if (emUso.has(ex)) ex.arquivado = false;
    return emUso.has(ex) || ex.arquivado || comDados.has(ex.id) || salvos.has(chaveDe(ex));
  });
}

// Dados da versão 1: tira o treino de exemplo antigo (se nunca foi mexido nem usado). O programa entra na versão 5.
function tirarExemploAntigo(d) {
  const usado = id => d.sessao?.treinoId === id || d.historico.some(h => h.treinoId === id);
  const exemploAntigo = t => t.nome === 'Treino A' && t.exercicios.map(e => e.nome).join('|') === 'Remada alta|Leg press' && !usado(t.id);
  d.treinos = d.treinos.filter(t => !exemploAntigo(t));
}

// Versão 4 (séries A, P e T): o descanso de 60 s, o padrão antigo, vira 120 s, o indicado para as séries de trabalho.
// Quem tinha outro tempo continua com ele.
function descansoDeTrabalho(d) {
  for (const e of [...d.treinos.flatMap(t => t.exercicios), ...(d.sessao?.exercicios || [])]) if (e.descanso === 60) e.descanso = DESCANSO_PADRAO;
}

/* ---------- Programas salvos ---------- */
// Guarda uma cópia dos treinos de agora em Programas salvos (o mais recente fica em cima)
function guardarPrograma(d, nome = d.programa.nome) {
  d.programas.unshift({ id: uid(), nome: nome || 'Programa', inicio: d.programa.inicio, salvo: Date.now(), treinos: structuredClone(d.treinos) });
}
// Exercícios que saíram dos treinos vão para o arquivo da Biblioteca, com todos os registros
function arquivarQueSaiu(d, antes) {
  const achar = indiceBiblioteca(d), ficam = new Set([...itensNomeados(d)].map(({ e }) => chaveDe(e)));
  for (const t of antes) for (const e of t.exercicios) if (nomeado(e) && !ficam.has(chaveDe(e))) achar(e).arquivado = true;
}

// Versão 5: entra o programa de 5 dias e os treinos de agora vão para Programas salvos. O exercício que você já tem
// continua com o nome e o histórico: só muda de dia, séries, repetições, séries A e P e descanso. Vale um dos nomes
// da linha (no treino do mesmo dia, em outro treino ou na Biblioteca) ou, por último, um nome parecido nos treinos:
// o mesmo começo, com mais palavras no fim ("Abdominal na máquina (crunch)"), e o mesmo grupo muscular.
// O cardio dos treinos de um dia continua no treino novo desse dia (no começo, se vinha antes da musculação);
// treinos sem musculação ficam como estão.
function programaNovo(d) {
  const antes = d.treinos;
  const forca = t => t.exercicios.filter(forcaNomeada);
  const velhos = antes.filter(t => forca(t).length), todos = velhos.flatMap(forca);
  const doDia = dia => velhos.filter(t => t.dias.includes(dia));
  const registroDe = indiceBiblioteca(d);
  const escolhidos = new Set(); // exercício já escolhido por uma linha não serve de parecido para outra
  const itensUsados = new Set(), treinosUsados = new Set(); // cada um empresta o id (o treino, também o cardio) uma vez só
  const parecido = (k, x, grupo) => {
    const j = chaveNome(x.nome), [curto, longo] = k.length < j.length ? [k, j] : [j, k];
    return curto.split(' ').length >= 2 && longo.startsWith(curto + ' ') && registroDe(x).grupo === grupo;
  };
  const existente = (nomes, dia) => {
    const chaves = nomes.map(chaveNome), grupo = grupoPeloNome(nomes[0]), daqui = doDia(dia).flatMap(forca);
    const igual = x => !ehCardio(x) && chaves.includes(chaveNome(x.nome));
    const perto = x => !escolhidos.has(x) && chaves.some(k => parecido(k, x, grupo));
    const x = daqui.find(igual) || todos.find(igual) || d.biblioteca.find(igual) || daqui.find(perto) || todos.find(perto);
    if (!x) return null;
    escolhidos.add(x);
    if (!daqui.includes(x) || itensUsados.has(x)) return { nome: x.nome };
    itensUsados.add(x);
    return { nome: x.nome, id: x.id, prioridade: x.prioridade };
  };
  if (antes.length) guardarPrograma(d, 'Programa anterior');
  d.treinos = treinosDoPrograma(existente);
  for (const t of d.treinos) {
    const daqui = doDia(t.dias[0]).filter(v => !treinosUsados.has(v));
    if (daqui.length) t.id = daqui[0].id;
    for (const v of daqui) {
      treinosUsados.add(v);
      const i = v.exercicios.findIndex(forcaNomeada);
      t.exercicios = [...v.exercicios.slice(0, i).filter(ehCardio), ...t.exercicios, ...v.exercicios.slice(i + 1).filter(ehCardio)];
    }
  }
  // Treinos sem musculação continuam; o cardio de um treino que não tem mais dia no programa vira um treino de cardio
  const dias = new Set(PROGRAMA.map(p => p.dia));
  for (const t of antes) {
    if (!velhos.includes(t)) d.treinos.push(t);
    else if (!t.dias.some(x => dias.has(x)) && t.exercicios.some(ehCardio)) d.treinos.push({ ...t, nome: 'Cardio', foco: '', exercicios: t.exercicios.filter(ehCardio) });
  }
  d.programa = { nome: NOME_PROGRAMA, inicio: null };
  arquivarQueSaiu(d, antes);
}
// Dados de antes da versão 5: o programa novo entrou (e os treinos que havia foram para Programas salvos)
const antesDoPrograma = bruto => (Number(bruto?.v) || 1) < 5;

// Migrações por versão: cada uma recebe os dados já validados da versão anterior, com a Biblioteca ligada
const MIGRACOES = { 2: tirarExemploAntigo, 4: descansoDeTrabalho, 5: programaNovo };

function normalizar(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.treinos)) return null;
  const padrao = novoExercicio();
  const aparelho = a => APARELHOS[a] ? a : 'esteira';
  // Séries e trechos: números sempre como número ou vazio (um backup adulterado não injeta texto na tela)
  const linhas = (lista, campos, comFeita) => objetos(lista).map(s => ({
    ...Object.fromEntries(campos.map(k => [k, lerCampo(k, s[k])])),
    ...(s.mais === true && { mais: true }), // "ainda dava para fazer muito mais" (só guardado quando marcado)
    // Aquecimento ou preparação, com a % da carga de trabalho (as séries de trabalho não levam tipo)
    ...((s.tipo === 'A' || s.tipo === 'P') && { tipo: s.tipo, pct: clampInt(s.pct, 1, 100, s.tipo === 'A' ? 40 : 80) }),
    ...(comFeita && { feita: !!s.feita }),
  }));
  const corpo = c => ({ peso: lerCampo('peso', c?.peso), altura: lerCampo('altura', c?.altura) });
  const item = e => ehCardio(e)
    ? { id: String(e.id || uid()), tipo: 'cardio', aparelho: aparelho(e.aparelho), meta: String(e.meta ?? '').slice(0, 30) }
    : {
      id: String(e.id || uid()), nome: String(e.nome ?? ''),
      series: clampInt(e.series, 1, 99, padrao.series), reps: textoReps(e.reps) || padrao.reps,
      descanso: clampInt(e.descanso, 5, 600, padrao.descanso), prioridade: !!e.prioridade,
      descansoA: clampInt(e.descansoA, 5, 600, padrao.descansoA), descansoP: clampInt(e.descansoP, 5, 600, padrao.descansoP),
      preparo: temChave(PLANOS, e.preparo) ? e.preparo : '', falha: !!e.falha, biset: !!e.biset, obs: String(e.obs ?? '').slice(0, 100),
    };
  const treino = t => ({
    id: String(t.id || uid()), nome: String(t.nome ?? ''), foco: String(t.foco ?? ''),
    dias: Array.isArray(t.dias) ? [...new Set(t.dias.map(Number).filter(n => Number.isInteger(n) && n >= 0 && n <= 6))] : [],
    exercicios: objetos(t.exercicios).map(item),
  });
  // Início da semana 1 do programa (meia-noite do dia) ou null, enquanto ele não começou
  const inicio = v => Number(v) > 0 ? +inicioDoDia(Number(v)) : null;
  const sessaoOk = d.sessao && Array.isArray(d.sessao.exercicios) && d.sessao.exercicios.every(e => e && Array.isArray(e.sets));
  const saida = {
    v: VERSAO,
    treinos: objetos(d.treinos).map(treino),
    programa: { nome: String(d.programa?.nome ?? '').slice(0, 40), inicio: inicio(d.programa?.inicio) },
    programas: objetos(d.programas).filter(p => Array.isArray(p.treinos)).map(p => ({
      id: String(p.id || uid()), nome: String(p.nome ?? '').slice(0, 40), inicio: inicio(p.inicio), salvo: Number(p.salvo) || Date.now(),
      treinos: objetos(p.treinos).map(treino),
    })),
    sessao: sessaoOk ? {
      treinoId: String(d.sessao.treinoId ?? ''), nome: String(d.sessao.nome ?? 'Treino'), inicio: Number(d.sessao.inicio) || Date.now(),
      exercicios: d.sessao.exercicios.map(e => {
        const base = item(e);
        return { ...base, exId: String(e.exId ?? ''), feito: !!(e.feito || e.status === 'feito'), sets: linhas(e.sets, camposDe(base), true) };
      }),
    } : null,
    // exId liga cada registro ao exercício da Biblioteca (dados antigos sem ele são ligados pelo nome)
    historico: objetos(d.historico).filter(h => Array.isArray(h.exercicios)).map(h => {
      const exercicios = objetos(h.exercicios).map(e => {
        const exId = String(e.exId ?? '');
        if (!ehCardio(e)) return { exId, nome: String(e.nome ?? ''), metaSeries: e.metaSeries, metaReps: e.metaReps, series: linhas(e.series, CAMPOS_FORCA) };
        const base = item(e);
        delete base.id; // o registro aponta para a Biblioteca (exId), não para o item do treino
        return { exId, ...base, series: linhas(e.series, camposDe(base)), corpo: corpo(e.corpo) };
      });
      const forca = exercicios.filter(e => !ehCardio(e));
      return {
        id: String(h.id || uid()), treinoId: h.treinoId, nome: String(h.nome ?? 'Treino'),
        inicio: Number(h.inicio) || Date.now(), fim: Number(h.fim) || Number(h.inicio) || Date.now(),
        // planejado no treino inteiro (base da intensidade no calendário): séries de musculação e cardios
        planejadas: clampInt(h.planejadas, 0, 999, forca.reduce((a, e) => a + (Number(e.metaSeries) || e.series.length), 0)),
        cardioPlanejados: clampInt(h.cardioPlanejados, 0, 99, exercicios.length - forca.length),
        exercicios,
      };
    }),
    perfil: corpo(d.perfil),
    pesos: lerPesos(d.pesos),
  };
  sincronizarBiblioteca(saida, d.biblioteca);
  for (let v = (Number(d.v) || 1) + 1; v <= VERSAO; v++) MIGRACOES[v]?.(saida);
  podarBiblioteca(saida); // depois das migrações: registro na Biblioteca também para o que elas puseram nos treinos
  return saida;
}

function carregar() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const j = JSON.parse(raw), d = normalizar(j);
      if (d) { programaTrocado = antesDoPrograma(j); return d; }
    }
  } catch { /* dados ilegíveis: começa com o exemplo */ }
  return exemplo();
}

let programaTrocado = false; // o programa novo entrou ao abrir esta versão: grava na hora e avisa
let S = carregar();
let saveTimer = 0;
function salvar() { clearTimeout(saveTimer); saveTimer = setTimeout(salvarAgora, 300); }
function salvarAgora() {
  clearTimeout(saveTimer);
  podarBiblioteca(S); // a Biblioteca acompanha os treinos a cada gravação
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { toast('Não foi possível salvar neste navegador.'); }
  agendarBackup(); // backup no Google Drive alguns segundos depois da última mudança
}
window.addEventListener('pagehide', salvarAgora);
let diaRenderizado = new Date().toDateString();
document.addEventListener('visibilitychange', () => {

});

const ui = {
  tab: 'hoje', exAberto: null, histAberto: new Set(), desfazer: null, toastT: 0, fecharDialogo: null, periodo: '12',

};
const treinoPorId = id => S.treinos.find(t => t.id === id);
const programaPorId = id => S.programas.find(p => p.id === id);
const exDoTreino = (tid, id) => treinoPorId(tid)?.exercicios.find(e => e.id === id);
const exSessao = id => S.sessao?.exercicios.find(e => e.id === id);
const exAberto = () => ui.exAberto ? exSessao(ui.exAberto) : null;
// Na sessão, só "feito" é guardado; "em andamento" vem das séries marcadas
const estadoEx = e => e.feito ? 'feito' : e.sets.some(s => s.feita) ? 'andamento' : 'pendente';

// Troca o HTML de um bloco e devolve o foco ao mesmo botão, se ele estava focado ali
function trocarHTML(box, html) {
  const chave = el => ['act', 'id', 't', 'i', 'd', 'p', 'a', 'tab'].map(k => el.dataset[k] ?? '').join('|');
  const ativo = document.activeElement;
  const alvo = ativo?.tagName === 'BUTTON' && box.contains(ativo) ? chave(ativo) : null;
  box.innerHTML = html;
  if (alvo) [...box.querySelectorAll('button[data-act]')].find(b => chave(b) === alvo)?.focus({ preventScroll: true });
}

// Séries (ou trechos) da última vez que o exercício da Biblioteca foi feito, em qualquer treino
function ultimasSeries(exId) {
  for (const h of S.historico) {
    const e = h.exercicios.find(x => x.exId === exId);
    if (e && e.series.length) return e.series;
  }
  return [];
}

// Semana do programa (1, 2, 3…), de 7 em 7 dias desde o primeiro treino; 0 enquanto ele não começou
function semanaDoPrograma() {
  const ini = S.programa.inicio;
  return ini ? Math.floor(diasDesde(ini) / 7) + 1 : 0;
}
// F: a última série de trabalho vai até a falha (RIR 0), da semana 3 do programa em diante (sem F, undefined)
const serieAteFalha = e => e.falha && semanaDoPrograma() >= SEMANA_FALHA ? trabalho(e).slice(-1)[0] : undefined;

// Bi-set: o exercício marcado faz par com o próximo da lista, se os dois forem de musculação
// (lido de cima para baixo: o 2º de um par não começa outro)
function paresBiset(lista) {
  const pares = new Map();
  lista.forEach((e, i) => {
    const prox = lista[i + 1];
    if (e.biset && !pares.has(e) && prox && !ehCardio(e) && !ehCardio(prox)) {
      pares.set(e, { par: prox, primeiro: true });
      pares.set(prox, { par: e, primeiro: false });
    }
  });
  return pares;
}
// O par de um exercício do treino em andamento: { par, primeiro } ou nada
const parDoBiset = e => S.sessao && paresBiset(S.sessao.exercicios).get(e);
// O app vai para o outro exercício do par: ele não foi finalizado e ainda tem série de trabalho por fazer
const vaiParaOPar = b => !!b && !b.par.feito && trabalho(b.par).some(x => !x.feita);
// Descanso depois de uma série: o do tipo dela. No bi-set, depois de uma série de trabalho do 1º exercício do par
// não tem descanso (0: vem o outro exercício), enquanto o outro ainda tiver série de trabalho por fazer
const descansoApos = (e, s, b = parDoBiset(e)) => ehTrabalho(s) && b?.primeiro && vaiParaOPar(b) ? 0 : descansoDe(e, s);

const TELAS = { hoje: viewHoje, treinos: viewTreinos, biblioteca: viewBiblioteca, historico: viewHistorico, peso: viewPeso, ajustes: viewAjustes };
// O que a tela pede para fazer depois de entrar na página: desenhar os gráficos, que precisam da largura

// Botões de escolha (período, filtro): um aperta e os outros soltam
const filtrosHTML = (opcoes, act, atual, rotulo) => `<div class="filtros" role="group" aria-label="${rotulo}">${opcoes.map(([k, texto]) =>
  `<button data-act="${act}" data-p="${k}" aria-pressed="${atual === k}">${texto}</button>`).join('')}</div>`;

// "3 × 10–15", com F quando a última série vai até a falha
const metaTxt = e => ehCardio(e) ? esc(e.meta || 'Cardio') : `${e.series} × ${esc(e.reps)}${e.falha ? ' F' : ''}`;
// "6 exercícios e 1 cardio"
function contagemItens(itens) {
  const nCardio = itens.filter(ehCardio).length, nForca = itens.length - nCardio;
  return [nForca && plural(nForca, 'exercício', 'exercícios'), nCardio && plural(nCardio, 'cardio', 'cardios')].filter(Boolean).join(' e ') || 'Nenhum exercício';
}
// Etiquetas do exercício: prioridade e bi-set (b: o par dele, de paresBiset)
const tagsEx = (e, b) => (e.prioridade ? '<span class="tag">Prioridade</span>' : '') + (b ? '<span class="tag cinza">Bi-set</span>' : '');
// Um item na lista de um treino: nome, etiquetas e meta
const linhaResumo = (e, b) => `<li><span class="tc-nome">${esc(nomeItem(e) || 'Sem nome')}${tagsEx(e, b)}</span><span class="num">${metaTxt(e)}</span></li>`;

function viewHoje() {
  if (S.sessao) return viewSessao();
  const agora = new Date(), wd = agora.getDay();
  const doDia = S.treinos.filter(t => t.dias.includes(wd));
  const outros = S.treinos.filter(t => !t.dias.includes(wd));
  const semana = semanaDoPrograma();
  let h = `<section class="page"><header class="page-head"><div><p>Hoje</p><h1>${DIAS_LONGO[wd]}, ${agora.getDate()} ${MESES[agora.getMonth()]}</h1></div>${semana > 0 ? `<span class="small muted">Semana ${semana} do programa</span>` : ''}</header>`;
  if (!S.treinos.length) {
    h += `<div class="panel empty"><h2>Nenhum treino criado</h2><p class="muted">Crie um treino com seus exercícios e escolha os dias da semana.</p><button class="btn primary" data-act="novo-treino">+ Criar treino</button></div>`;
  } else if (!doDia.length) {
    h += `<div class="panel empty"><h2>Nenhum treino marcado para ${DIAS_LONGO[wd].toLowerCase()}</h2><p class="muted">Escolha um treino abaixo para fazer hoje, ou marque os dias na aba Treinos.</p></div>`;
  }
  h += doDia.map(t => {
    const pares = paresBiset(t.exercicios);
    return `
    <article class="panel">
      <div class="tc-head"><div><h2>${esc(t.nome || 'Sem nome')}</h2>${t.foco ? `<p class="small muted">${esc(t.foco)}</p>` : ''}</div><span class="small muted">${contagemItens(t.exercicios)}</span></div>
      ${t.exercicios.length
        ? `<ul class="tc-ex">${t.exercicios.map(e => linhaResumo(e, pares.get(e))).join('')}</ul>`
        : '<p class="muted">Este treino ainda não tem exercícios.</p>'}
      <button class="btn primary block" data-act="iniciar" data-id="${esc(t.id)}">Iniciar treino</button>
    </article>`;
  }).join('');
  if (outros.length) {
    h += `<h2 class="section-title">${doDia.length ? 'Outros treinos' : 'Seus treinos'}</h2><div class="row-list">${outros.map(t => `
      <div class="row"><div class="row-main"><b>${esc(t.nome || 'Sem nome')}</b><span class="small muted">${diasTxt(t.dias)}</span></div>
      <button class="btn ghost small" data-act="iniciar" data-id="${esc(t.id)}">Iniciar</button></div>`).join('')}</div>`;
  }
  return h + '</section>';
}

function viewSessao() {
  const s = S.sessao;
  const total = s.exercicios.length;
  const feitos = s.exercicios.filter(e => e.feito).length;
  const pares = paresBiset(s.exercicios);
  return `<section class="page">

}

// Exercício no editor: nome, séries de trabalho, repetições, prioridade e, embaixo, as séries A e P, o descanso

      <label class="fld descanso"><span>Descanso T (s)</span><input class="field num" inputmode="numeric" maxlength="3" data-f="e-descanso" ${alvo} value="${e.descanso}"></label>
      <label class="fld obs"><span>Observação</span><input class="field" data-f="e-obs" ${alvo} value="${esc(e.obs)}" placeholder="Ex.: cotovelo alto" maxlength="100"></label>
      <button class="icon-btn marca falha num" data-act="falha" ${alvo} aria-pressed="${e.falha}" aria-label="F, última série até a falha: ${nome}" title="F: a última série de trabalho vai até a falha (da semana ${SEMANA_FALHA} em diante)">F</button>
      <button class="icon-btn marca biset" data-act="biset" ${alvo} aria-pressed="${e.biset}" aria-label="Bi-set com o próximo exercício: ${nome}" title="Bi-set com o próximo exercício">${icon('biset')}</button>

// Peso e altura de quando o cardio foi feito (ou os atuais, se na época estavam vazios)
const corpoDe = e => ({ peso: e.corpo?.peso || pesoAtual(), altura: e.corpo?.altura || S.perfil.altura });
// Calorias de todos os cardios de um registro (null se faltar o peso)
function kcalDoRegistro(h) {
  const v = h.exercicios.filter(ehCardio).map(e => contaCardio(e, e.series, corpoDe(e)).kcal).filter(x => x != null);
  return v.length ? v.reduce((a, x) => a + x, 0) : null;
}

// Séries de um exercício num registro; o título é o nome dele (no histórico) ou o dia (na Biblioteca)
const MARCA_MAIS = `<span class="mais-hist" role="img" aria-label="ainda dava para fazer muito mais" title="Ainda dava para fazer muito mais">${icon('mais', 15)}</span>`;
function histForca(e, titulo = esc(nomeItem(exPorId(e.exId) || e))) {
  return `<div class="hist-ex"><h3>${titulo}</h3><ol class="hist-sets">${e.series.map(s => `
    <li${s.tipo ? ' class="preparo"' : ''}><span class="muted" title="${NOME_TIPO[tipoSerie(s)]}">${tipoSerie(s)}</span><span>${comUnidade(s.peso, 'kg')}</span><span>${comUnidade(s.reps, 'reps')}</span><span class="muted">${vazio(s.rir) ? '' : 'RIR ' + s.rir}${s.mais ? MARCA_MAIS : ''}</span></li>`).join('')}
  </ol></div>`;
}

function histCardio(e, titulo = esc(APARELHOS[e.aparelho].nome)) {
  const a = APARELHOS[e.aparelho], c = contaCardio(e, e.series, corpoDe(e));
  const linhas = e.series.map((t, i) => {
    // A última coluna (em cinza) é sempre a conta: velocidade ou ritmo
    const cols = a.historico(t, c.contas[i]);
    return `<li><span class="muted">${i + 1}</span>${cols.map((v, j) => `<span${j === cols.length - 1 ? ' class="muted"' : ''}>${v}</span>`).join('')}</li>`;
  }).join('');
  const extras = [c.kcal != null && `${aprox(c.kcal)} kcal`, ...a.extras(c)].filter(Boolean);
  return `<div class="hist-ex"><h3>${titulo}</h3><ol class="hist-sets">${linhas}</ol>${extras.length ? `<p class="small muted">${extras.join(', ')}</p>` : ''}</div>`;
}

/* ---------- Biblioteca ---------- */
const FILTROS_LIB = [['todos', 'Todos'], ['uso', 'Em uso'], ['fora', 'Fora do plano'], ['arquivados', 'Arquivados']];
const VAZIO_LIB = {
  todos: 'A Biblioteca se monta sozinha com os exercícios dos seus treinos.',
  uso: 'Nenhum exercício nos treinos ainda.',
  fora: 'Nenhum exercício fora do plano. Quem sai dos treinos, mas tem registros, aparece aqui.',
  arquivados: 'Nenhum exercício arquivado. Na página de um exercício, Arquivar tira ele dos treinos e guarda os registros.',
};

// Situação de cada exercício: em quais treinos está, quantos dias de registro tem e quando foi o último
function situacoes() {
  const treinos = new Map(), dados = new Map();
  for (const { t, e } of itensNomeados(S)) {
    const chave = chaveDe(e), lista = treinos.get(chave) || [], nome = t.nome || 'Sem nome';
    if (!lista.includes(nome)) lista.push(nome);
    treinos.set(chave, lista);
  }
  for (const h of S.historico) for (const id of new Set(h.exercicios.map(e => e.exId))) {
    const d = dados.get(id) || { dias: 0, ultimo: 0 };
    d.dias++;
    d.ultimo = Math.max(d.ultimo, h.inicio);
    dados.set(id, d);
  }
  return ex => {
    const nos = treinos.get(chaveDe(ex)) || [];
    return { ...(dados.get(ex.id) || { dias: 0, ultimo: 0 }), treinos: nos, situacao: nos.length ? 'uso' : ex.arquivado ? 'arquivados' : 'fora' };
  };
}
const listaE = l => l.length > 1 ? `${l.slice(0, -1).join(', ')} e ${l[l.length - 1]}` : l[0];
const textoSituacao = s => s.treinos.length ? `${s.treinos.length > 1 ? 'Nos treinos' : 'No treino'} ${listaE(s.treinos)}`
  : s.situacao === 'arquivados' ? 'Arquivado: fora dos treinos, com os registros guardados' : 'Fora do plano';

function viewBiblioteca() {
  const ex = exPorId(ui.libAberto);
  if (ex) return viewExercicio(ex);
  return `<section class="page">
    <header class="page-head"><div><h1>Biblioteca</h1><p>Todos os exercícios, com a evolução de cada um.</p></div></header>
    <input class="field busca" type="search" id="lib-busca" value="${esc(ui.libBusca)}" placeholder="Buscar exercício" aria-label="Buscar exercício" autocomplete="off">

    <div id="lib-lista" class="lib-lista">${listaBibliotecaHTML()}</div>
  </section>`;
}

function listaBibliotecaHTML() {
  const situacao = situacoes(), busca = chaveNome(ui.libBusca);
  const itens = S.biblioteca.map(ex => ({ ex, ...situacao(ex) }))
    .filter(x => (ui.libFiltro === 'todos' || x.situacao === ui.libFiltro) && (!busca || chaveNome(nomeItem(x.ex)).includes(busca)))

  const item = x => `<li><button class="row lib-item${x.situacao === 'arquivados' ? ' arquivado' : ''}" data-act="lib-abrir" data-id="${esc(x.ex.id)}">
      <span class="row-main"><b>${esc(nomeItem(x.ex))}</b><span class="small muted">${esc(textoSituacao(x))}</span></span>
      <span class="hist-stats"><span><b>${x.dias}</b>${x.dias === 1 ? 'treino' : 'treinos'}</span><span><b>${x.ultimo ? fmtDiaMes(x.ultimo) : '–'}</b>último</span></span>

  return grupo('Musculação', itens.filter(x => !ehCardio(x.ex))) + grupo('Cardio', itens.filter(x => ehCardio(x.ex)));
}

// Dias de treino de um exercício, do mais antigo ao mais novo. base é o que os gráficos e o recorde leem:
// as séries do dia (musculação) ou a conta dos trechos (cardio; null se nenhum trecho estiver completo)
function diasDoExercicio(ex) {
  const dias = [];
  for (const h of S.historico) {
    const entradas = h.exercicios.filter(e => e.exId === ex.id);
    if (!entradas.length) continue;
    const series = entradas.flatMap(e => e.series).filter(ehTrabalho); // musculação: só as séries de trabalho
    const conta = ehCardio(ex) && contaCardio(entradas[0], series, corpoDe(entradas[0]));
    dias.push({ t: h.inicio, treino: h.nome, entradas, base: conta ? (conta.n ? conta : null) : series });
  }
  return dias.sort((a, b) => a.t - b.t);
}
const numeroOuNada = v => Number.isFinite(v) ? v : null;
const SERIES_FAIXA = [['max', 'Máxima', 'var(--s2)'], ['med', 'Média', 'var(--s1)'], ['min', 'Mínima', 'var(--s3)']];
// Legenda dos gráficos de linha (um traço na cor de cada série) e um quadro de número (rótulo em cima)
const legendaHTML = series => `<div class="legenda-linhas" aria-hidden="true">${series.map(({ nome, cor }) => `<span><i style="--c:${cor}"></i>${nome}</span>`).join('')}</div>`;
const statHTML = (rotulo, valor) => `<div class="stat"><span>${rotulo}</span><b class="num">${valor}</b></div>`;
// Início do período dos filtros (Máx, 12M, 6M…), em ms: Máx é desde sempre
const inicioDoPeriodo = p => p === 'max' ? 0 : +mesesAtras(Number(p));
function seriesDoGrafico(cfg, dias) {
  const bases = dias.map(d => d.base);
  if (!cfg.faixa) return [{ nome: cfg.titulo, cor: 'var(--s1)', valores: bases.map(b => numeroOuNada(b && cfg.valor(b))) }];
  const faixas = bases.map(b => b && cfg.faixa(b));
  // A média é desenhada por cima: quando as três coincidem (todas as séries iguais), é ela que aparece
  return SERIES_FAIXA.map(([k, nome, cor]) => ({ nome, cor, frente: k === 'med', valores: faixas.map(f => numeroOuNada(f?.[k])) }));
}

function viewExercicio(ex) {
  const cardio = ehCardio(ex), def = cardio ? APARELHOS[ex.aparelho] : FORCA, situacao = situacoes()(ex);
  const todos = diasDoExercicio(ex);
  const limite = inicioDoPeriodo(ui.periodoEx);
  const dias = todos.filter(d => d.t >= limite);
  const recordes = todos.map(d => numeroOuNada(d.base && def.recorde.valor(d.base))).filter(v => v != null);
  const id = esc(ex.id), arquivado = situacao.situacao === 'arquivados';
  def.graficos.forEach((cfg, i) => aoMontar.push(() => desenharLinhas($(`.graf[data-g="${i}"]`),
    { ...cfg, dias, series: seriesDoGrafico(cfg, dias), unidade: ['dia de treino', 'dias de treino'], quando: TEXTO_PERIODO[ui.periodoEx] })));
  const legenda = legendaHTML(SERIES_FAIXA.map(([, nome, cor]) => ({ nome, cor })));
  const registros = dias.slice().reverse().map(d => {
    const titulo = `${fmtData(d.t)} <span class="small muted">${esc(d.treino)}</span>`;
    return `<article class="hist registro">${d.entradas.map(e => cardio ? histCardio(e, titulo) : histForca(e, titulo)).join('')}</article>`;
  }).join('');
  return `<section class="page">
    <button class="voltar" data-act="lib-voltar">${icon('voltar', 18)}Biblioteca</button>
    <header class="ex-cabeca">
      <div class="ex-titulo">

/* ---------- Peso corporal ---------- */
// O peso de agora (calorias do cardio e "Seu peso"): o do último registro. Sem registros, o que foi digitado em
// Seus dados antes de a aba Peso existir.
const pesoAtual = () => S.pesos.length ? S.pesos[S.pesos.length - 1].kg : S.perfil.peso;
const corpoAtual = () => ({ peso: pesoAtual(), altura: S.perfil.altura });
const fmtVariacao = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${fmtKg(Math.abs(v))}`;
const dataDoDia = dia => fmtData(lerDataISO(dia));
// Média dos registros dos 7 dias até cada um (o próprio dia e os 6 anteriores), com uma casa: mostra a tendência
// sem o sobe e desce de água e comida. Uma passada só: a janela anda junto com os registros.
function mediasDe7Dias(pesos) {
  let ini = 0, soma = 0;
  return pesos.map((p, i) => {
    soma += p.kg;
    const desde = dataISO(somarDias(lerDataISO(p.dia), -6));
    while (pesos[ini].dia < desde) soma -= pesos[ini++].kg;
    return Math.round(soma / (i - ini + 1) * 10) / 10;
  });
}
// "−0,4 kg desde 20 Nov" (em relação ao registro anterior)
const variacaoDoDia = i => i ? `${fmtVariacao(S.pesos[i].kg - S.pesos[i - 1].kg)} desde ${fmtDiaMes(lerDataISO(S.pesos[i - 1].dia))}` : 'Primeiro registro';
const SERIES_PESO = [{ nome: 'Peso do dia', cor: 'var(--s1)' }, { nome: 'Média de 7 dias', cor: 'var(--s2)' }];

function viewPeso() {
  const atual = S.pesos[S.pesos.length - 1], hoje = hojeISO();
  const form = `<div class="panel">
      <div class="peso-form">
        <label class="fld"><span>Peso (kg)</span><input class="field num" inputmode="decimal" id="peso-kg" data-filtro="peso" placeholder="${atual ? fmtNum(atual.kg) : 'Ex.: 80,5'}"></label>
        <label class="fld"><span>Dia</span><input class="field" type="date" id="peso-dia" value="${hoje}" max="${hoje}"></label>
        <button class="btn primary" data-act="peso-registrar">Registrar</button>
      </div>
      <p class="hint">Um registro por dia: registrar de novo no mesmo dia troca o anterior. O último peso também é o usado nas calorias do cardio.</p>
    </div>`;
  const cabeca = `<header class="page-head"><div><h1>Peso</h1><p>Registre seu peso e acompanhe a evolução.</p></div></header>`;
  if (!atual) return `<section class="page">${cabeca}${form}<div class="panel empty"><p class="muted">Nenhum peso registrado ainda. Registre o de hoje acima: o gráfico aparece a partir do primeiro registro.</p></div></section>`;
  // Os registros do período são o fim da lista (ela vai do mais antigo ao mais novo); ini é a posição do primeiro
  const limite = inicioDoPeriodo(ui.periodoPeso), achou = S.pesos.findIndex(x => lerDataISO(x.dia) >= limite);
  const ini = achou < 0 ? S.pesos.length : achou, doPeriodo = S.pesos.slice(ini);
  const kgs = doPeriodo.map(x => x.kg), medias = mediasDe7Dias(S.pesos).slice(ini);
  const variacoes = doPeriodo.map((_, j) => variacaoDoDia(ini + j));
  aoMontar.push(() => desenharLinhas($('#graf-peso'), {
    titulo: 'Peso', fmt: fmtKg, unidade: ['registro', 'registros'],
    quando: ui.periodoPeso === 'max' ? 'desde o primeiro registro' : TEXTO_PERIODO[ui.periodoPeso],
    dias: doPeriodo.map((x, j) => ({ t: lerDataISO(x.dia), treino: variacoes[j] })),
    series: [{ ...SERIES_PESO[0], valores: kgs, frente: true }, { ...SERIES_PESO[1], valores: medias }],
  }));
  const registros = doPeriodo.map(({ dia, kg }, j) => {
    const d = esc(dia), quando = dataDoDia(dia);
    return `<li class="row peso-linha">
      <span class="row-main"><b>${quando}</b><span class="small muted">${variacoes[j]}</span></span>
      <label class="peso-edit"><input class="field num" inputmode="decimal" data-filtro="peso" data-peso-dia="${d}" value="${fmtNum(kg)}" aria-label="Peso de ${quando}, em kg">kg</label>
      <button class="icon-btn danger" data-act="peso-apagar" data-d="${d}" aria-label="Apagar o peso de ${quando}">${icon('lixo')}</button>
    </li>`;
  }).reverse().join('');
  return `<section class="page">${cabeca}${form}
    <div class="stats quatro">
      ${statHTML('Atual', fmtKg(atual.kg))}
      ${statHTML('Variação', kgs.length > 1 ? fmtVariacao(kgs[kgs.length - 1] - kgs[0]) : '–')}
      ${statHTML('Menor', kgs.length ? fmtKg(Math.min(...kgs)) : '–')}
      ${statHTML('Maior', kgs.length ? fmtKg(Math.max(...kgs)) : '–')}
    </div>
    ${filtrosHTML(PERIODOS, 'periodo-peso', ui.periodoPeso, 'Período do gráfico e dos registros')}
    <section class="panel grafico">
      <div><h2>Peso</h2><p class="small muted">Peso de cada registro e a média dos 7 dias até ele. A variação é do primeiro ao último registro do período.</p></div>
      ${legendaHTML(SERIES_PESO)}
      <div class="graf" id="graf-peso"></div>
    </section>
    <h2 class="section-title">Registros</h2>
    ${registros ? `<ul class="row-list">${registros}</ul>` : '<div class="panel empty"><p class="muted">Nenhum registro neste período.</p></div>'}
  </section>`;
}

// Registra (ou troca) o peso de um dia, e apaga. O último registro é o peso de agora (pesoAtual).
function guardarPeso(dia, kg) { S.pesos = [...S.pesos.filter(x => x.dia !== dia), { dia, kg }].sort(porDia); }
function apagarPeso(dia) { S.pesos = S.pesos.filter(x => x.dia !== dia); }
// Botão Registrar (ou Enter no campo do peso)
function registrarPeso() {
  const campo = $('#peso-kg'), kg = lerCampo('peso', campo.value.trim()), dia = $('#peso-dia').value;
  if (!pesoValido(kg)) { toast(AVISO_PESO); campo.focus(); return; }
  if (!diaValido(dia) || dia > hojeISO()) { toast('Escolha um dia até hoje.'); return; }
  const trocou = S.pesos.some(x => x.dia === dia);
  comDesfazer(`${trocou ? 'Peso trocado' : 'Peso registrado'}: ${fmtKg(kg)} em ${dataDoDia(dia)}`, () => guardarPeso(dia, kg));
}
// Peso corrigido na lista de registros
function corrigirPeso(el) {
  const { pesoDia: dia } = el.dataset, kg = lerCampo('peso', el.value.trim());
  if (!pesoValido(kg)) { toast(AVISO_PESO); render(); return; }
  if (S.pesos.find(x => x.dia === dia)?.kg !== kg) comDesfazer(`Peso de ${dataDoDia(dia)}: ${fmtKg(kg)}`, () => guardarPeso(dia, kg));
}
// "Seu peso" (em Ajustes ou no cardio): mudar vira o registro de hoje, com Desfazer. Grava ao sair do campo
// (não a cada tecla), para o Desfazer voltar ao peso de antes; então refaz as contas do cardio aberto.
function registrarPesoDeHoje(el) {
  const kg = lerCampo('peso', el.value.trim());
  if (!pesoValido(kg)) { toast(AVISO_PESO); el.value = fmtNum(pesoAtual()); return; }
  if (kg === pesoAtual()) return;
  const mostrar = () => { document.querySelectorAll('[data-f="p-peso"]').forEach(x => { x.value = fmtNum(pesoAtual()); }); atualizarCalc(); };
  comDesfazer('Peso de hoje registrado na aba Peso', () => guardarPeso(hojeISO(), kg), () => { render(); mostrar(); }, mostrar);
}
