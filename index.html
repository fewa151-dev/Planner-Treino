}

/* ---------- Planilha CSV (para planilhas e para análise com IA) ---------- */
// Uma linha por série ou trecho; colunas que não valem para o tipo ficam vazias. Números com ponto, como pede o CSV.
const COLUNAS_CSV = ['data', 'hora', 'treino', 'exercicio', 'grupo_muscular', 'tipo', 'serie_ou_trecho', 'tipo_serie', 'peso_kg', 'repeticoes', 'rir', 'dava_muito_mais',
  'distancia_km', 'tempo_min', 'inclinacao_pct', 'degraus', 'esforco', 'velocidade_kmh', 'ritmo_min_por_km', 'degraus_por_min',
  'kcal_estimadas', 'peso_corporal_kg'];
const arred2 = v => Math.round(v * 100) / 100; // duas casas, no CSV e na planilha do Drive
const celulaCSV = v => {
  if (v == null || v === '') return '';
  if (typeof v === 'number') return String(arred2(v));
  const s = /^[=+\-@\t\r]/.test(v) ? `'${v}` : String(v); // a planilha não lê o texto como fórmula
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};

function linhasCSV(exId) {
  const linhas = [], porId = new Map(S.biblioteca.map(ex => [ex.id, ex]));
  const registros = exId ? S.historico.filter(h => h.exercicios.some(e => e.exId === exId)) : [...S.historico];
  for (const h of registros.sort((a, b) => a.inicio - b.inicio)) for (const e of h.exercicios) {
    if (exId && e.exId !== exId) continue;
    // exId não vai para o CSV: serve para separar as abas da planilha do Drive
    const base = { exId: e.exId, data: dataISO(h.inicio), hora: fmtHora(h.inicio), treino: h.nome, exercicio: nomeItem(porId.get(e.exId) || e), grupo_muscular: ehCardio(e) ? '' : GRUPOS[porId.get(e.exId)?.grupo] ?? '', tipo: ehCardio(e) ? 'cardio' : 'musculacao' };
    if (!ehCardio(e)) {
      const n = { A: 0, P: 0, T: 0 }; // número da série dentro do tipo: trabalho 1, 2, 3 (como nos arquivos antigos)
      e.series.forEach(s => linhas.push({ ...base, serie_ou_trecho: ++n[tipoSerie(s)], tipo_serie: NOME_TIPO[tipoSerie(s)].toLowerCase(), peso_kg: s.peso, repeticoes: s.reps, rir: s.rir, dava_muito_mais: s.mais ? 'sim' : '' }));
      continue;
    }
    const corpo = corpoDe(e), c = contaCardio(e, e.series, corpo);
    e.series.forEach((t, i) => {
      const r = c.contas[i] || {};
      linhas.push({
        ...base, serie_ou_trecho: i + 1, distancia_km: t.km, tempo_min: t.min, inclinacao_pct: t.incl, degraus: t.degraus,
        esforco: ESFORCOS[t.esforco]?.nome, velocidade_kmh: r.vel, ritmo_min_por_km: e.aparelho === 'esteira' ? r.ritmo : null,
        degraus_por_min: e.aparelho === 'escada' ? r.ritmo : null, kcal_estimadas: r.kcal, peso_corporal_kg: corpo.peso,
      });
    });
  }
  return linhas;
}

// Todos os dados de treino ou só os de um exercício da Biblioteca
function exportarCSV(exId) {
  const linhas = linhasCSV(exId);
  if (!linhas.length) return toast(exId ? 'Este exercício ainda não tem registros.' : 'Ainda não há treinos concluídos para exportar.');
  // BOM no começo do arquivo: o Excel reconhece os acentos (UTF-8)
  const csv = '\uFEFF' + [COLUNAS_CSV, ...linhas.map(l => COLUNAS_CSV.map(k => l[k]))].map(l => l.map(celulaCSV).join(',')).join('\r\n') + '\r\n';
  const nome = exId ? chaveNome(nomeItem(exPorId(exId))).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : 'dados';
  baixarArquivo(`treino-${nome || 'exercicio'}-${hojeISO()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('Planilha exportada');
}

/* ---------- Backup no Google Drive ----------
   O script planner-treino-apps-script.gs, publicado na conta Google da pessoa, guarda no Drive dela o backup
   (o mesmo formato de "Exportar backup"), uma cópia por dia e uma planilha com uma aba por exercício.
   O backup vai sozinho: na hora em que um treino é concluído e alguns segundos depois de qualquer outra mudança.
   "versao" é a data do último backup que este aparelho fez ou restaurou: se o Drive recebeu depois disso um backup
   de outro aparelho, a pessoa escolhe qual fica (o que sai é guardado na pasta Cópias do Drive). */
const DRIVE_KEY = 'planner-treino-drive';
// Fica só neste aparelho: endereço do script, chave, conta, versão e resumo (hash) do último backup e das abas
let DR = (() => { try { const o = JSON.parse(localStorage.getItem(DRIVE_KEY)); return o && typeof o === 'object' ? o : {}; } catch { return {}; } })();
const salvarDR = () => { try { localStorage.setItem(DRIVE_KEY, JSON.stringify(DR)); } catch { /* sem espaço: grava na próxima vez */ } };
const driveLigado = () => !!(DR.url && DR.chave);
// Só enquanto o app está aberto. pendente: há mudança esperando o backup; denovo: { substituir } de um backup pedido
// enquanto outro era enviado; planilha/planilhaDeNovo: o mesmo para a planilha; url: o que foi digitado no campo
const dr = { estado: 'ok', msg: '', pendente: false, ocupado: false, denovo: null, planilha: false, planilhaDeNovo: false, t: 0, conectando: false, url: null };

// Resumo curto (cyrb53) do conteúdo: diz se há mudança que o Drive ainda não tem
function hashTxt(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const chaveNova = () => b64url(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(24))));
const b64url = s => btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const nomeAparelho = () => /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'Celular' : 'Computador';
const urlScriptOk = u => /^https:\/\/script\.google(usercontent)?\.com\/\S+$/.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/\S*$/.test(u);
const linkGoogleOk = u => /^https:\/\/(docs|drive)\.google\.com\/\S+$/.test(u || '');
// Vai para o Drive tudo, menos um treino em andamento (ele entra quando for concluído)
const dadosDrive = () => ({ ...S, sessao: null });
const hashDados = () => hashTxt(JSON.stringify(dadosDrive()));
// "hoje às 14:32", "ontem às 09:10", "em 18 Nov às 20:01"
function quandoTxt(ts) {
  if (!Number.isFinite(ts)) return '';
  const dias = diasDesde(ts);
  return `${dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : `em ${fmtDiaMes(ts)}`} às ${fmtHora(ts)}`;
}
const backupDe = (atualizado, aparelho) => [quandoTxt(Date.parse(atualizado)), aparelho && `no ${aparelho}`].filter(Boolean).join(' ');

async function nuvem(acao, extra, alvo, espera = 40000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), espera);
  const semResposta = () => Object.assign(new Error(navigator.onLine === false
    ? 'Sem internet. O backup vai quando a conexão voltar.' : 'O script do Google não respondeu. Tente de novo em instantes.'), { rede: true });
  try {
    let r, j;
    try { r = await fetch(alvo.url, { method: 'POST', body: JSON.stringify({ acao, chave: alvo.chave, ...extra }), signal: ctl.signal }); }
    catch { throw semResposta(); }
    try { j = await r.json(); }
    catch { throw ctl.signal.aborted ? semResposta() : new Error('O script não respondeu como esperado. Confira se ele foi implantado como "App da Web", com acesso para "Qualquer pessoa".'); }
    if (j?.erro) {
      // Na autorização, ficou desmarcada a caixinha do Drive ou das Planilhas
      if (/DriveApp|SpreadsheetApp|auth\/(drive|spreadsheets)|permiss/i.test(j.erro)) throw new Error('O script ainda não tem permissão para usar seu Drive. Em script.google.com, abra o script, escolha a função "autorizar" ao lado de "Depuração", clique em Executar e marque todas as permissões.');
      throw new Error(j.erro);
    }
    return j;
  } finally { clearTimeout(t); }
}
function guardarInfo(r) {
  if (r.conta) DR.conta = String(r.conta);
  if (linkGoogleOk(r.pasta)) DR.pasta = r.pasta;
  if (linkGoogleOk(r.planilha)) DR.planilha = r.planilha;
  DR.planilhaDe = String(r.planilhaDe ?? ''); // se foi outro aparelho, as abas guardadas aqui não valem mais
}
// O Drive ficou com o backup "versao", cujo conteúdo tem o resumo "hash"
function emDia(versao, hash) {
  Object.assign(DR, { versao, hash, conflito: null });
  salvarDR();
  dr.pendente = hash !== hashDados(); // algo mudou enquanto enviava
  estadoDrive('ok');
}

function agendarBackup(ms = 20000) {
  if (!driveLigado() || DR.conflito) return;
  clearTimeout(dr.t);
  dr.t = setTimeout(fazerBackup, ms);
  if (!dr.pendente) { dr.pendente = true; renderDrive(); } // em Ajustes, mostra "Mudanças a enviar"
}

// manual: "Fazer backup agora" (envia mesmo sem mudança e avisa o resultado). substituir: a pessoa escolheu trocar
// o backup de outro aparelho pelo deste. avisarErro: logo depois de concluir um treino.
async function fazerBackup({ manual = false, substituir = false, avisarErro = manual } = {}) {
  if (!driveLigado() || (DR.conflito && !substituir)) return;
  if (dr.ocupado) {
    // Vai de novo quando o envio atual terminar (guardando a escolha de substituir)
    dr.denovo = { substituir: substituir || !!dr.denovo?.substituir };
    if (manual) toast('O backup já está sendo feito.');
    return;
  }
  clearTimeout(dr.t);
  const dados = dadosDrive(), h = hashTxt(JSON.stringify(dados)), alvo = DR;
  if (h === DR.hash && !manual && !substituir) {
    if (dr.pendente) { dr.pendente = false; renderDrive(); } // as mudanças não chegaram aos dados do backup
    return;
  }
  dr.ocupado = true;
  estadoDrive('enviando');
  let enviado = false;
  try {
    const r = await nuvem('enviar', { backup: pacoteBackup(dados), versao: DR.versao || '', aparelhoId: DR.aparelhoId, aparelho: nomeAparelho(), substituir }, alvo, 60000);
    if (DR !== alvo) return estadoDrive('ok'); // desconectou enquanto enviava
    guardarInfo(r);
    if (r.conflito) {
      DR.conflito = { aparelho: String(r.aparelho || ''), atualizado: String(r.atualizado || '') };
      salvarDR();
      estadoDrive('conflito');
      toast('O Drive tem um backup mais novo, de outro aparelho. Em Ajustes, escolha qual fica.');
      return;
    }
    emDia(r.atualizado, h);
    if (manual) toast('Backup feito no Google Drive');
    enviado = true;
  } catch (e) {
    if (DR !== alvo) return;
    estadoDrive(e.rede ? 'offline' : 'erro', e.message);
    if (avisarErro) toast(e.message);
  } finally {
    dr.ocupado = false;
    if (dr.denovo) {
      const { substituir } = dr.denovo;
      dr.denovo = null;
      clearTimeout(dr.t);
      dr.t = setTimeout(() => fazerBackup({ substituir }), 1000);
    }
  }
  // A planilha vai depois, sem segurar o próximo backup (na primeira vez ela leva alguns minutos)
  if (enviado) atualizarPlanilha();
}

/* Planilha do Drive: a aba Exercícios (todos, com a situação de cada um) e uma aba por exercício com registros,
   uma linha por série ou trecho. Só vão as abas que mudaram desde a última vez (o resumo de cada uma fica em DR.abas). */
const ABA_INDICE = 'Exercícios', ABA_PESO = 'Peso corporal';
const TITULOS_PLANILHA = {
  data: 'Data', hora: 'Hora', treino: 'Treino', serie_ou_trecho: 'Série', tipo_serie: 'Tipo de série', peso_kg: 'Peso (kg)', repeticoes: 'Repetições', rir: 'RIR',
  dava_muito_mais: 'Dava muito mais', distancia_km: 'Distância (km)', tempo_min: 'Tempo (min)', inclinacao_pct: 'Inclinação (%)',
  degraus: 'Degraus', esforco: 'Esforço', velocidade_kmh: 'Velocidade (km/h)', ritmo_min_por_km: 'Ritmo (min/km)',
  degraus_por_min: 'Degraus por min', kcal_estimadas: 'Kcal estimadas', peso_corporal_kg: 'Peso corporal (kg)',
};
const SITUACAO_PLANILHA = { uso: 'Em uso', fora: 'Fora do plano', arquivados: 'Arquivado' };
function abasPlanilha() {
  const situacao = situacoes(), porEx = new Map(), usados = new Set([ABA_INDICE.toLowerCase(), ABA_PESO.toLowerCase()]);
  for (const l of linhasCSV()) {
    const lista = porEx.get(l.exId);
    if (lista) lista.push(l); else porEx.set(l.exId, [l]);
  }
  // Nome de aba válido (sem os caracteres que o Excel recusa) e sem repetir
  const nomeAba = ex => {
    const base = nomeItem(ex).replace(/[[\]:*?/\\]/g, ' ').replace(/^'+|'+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 90) || 'Exercício';
    let nome = base;
    for (let n = 2; usados.has(nome.toLowerCase()); n++) nome = `${base.slice(0, 85)} (${n})`;
    usados.add(nome.toLowerCase());
    return nome;
  };
  const porNome = (a, b) => nomeItem(a).localeCompare(nomeItem(b), 'pt-BR');
  const exs = [...S.biblioteca.filter(ex => !ehCardio(ex)).sort(porNome), ...S.biblioteca.filter(ehCardio).sort(porNome)];
  const indice = { nome: ABA_INDICE, colunas: ['Exercício', 'Tipo', 'Grupo muscular', 'Situação', 'Treinos', 'Dias de treino', 'Último registro'], linhas: [] };
  const abas = [indice];
  if (S.pesos.length) {
    const medias = mediasDe7Dias(S.pesos);
    abas.push({ nome: ABA_PESO, colunas: ['Data', 'Peso (kg)', 'Média de 7 dias (kg)'], linhas: S.pesos.map((x, i) => [x.dia, x.kg, medias[i]]) });
  }
  for (const ex of exs) {
    const s = situacao(ex), linhas = porEx.get(ex.id) || [];
    indice.linhas.push([nomeItem(ex), ehCardio(ex) ? 'Cardio' : 'Musculação', GRUPOS[ex.grupo] ?? '', SITUACAO_PLANILHA[s.situacao], s.treinos.join(', '), s.dias, s.ultimo ? dataISO(s.ultimo) : '']);
    if (!linhas.length) continue;
    // Data, hora, treino e série sempre; as outras colunas só se o exercício tem algum valor nelas
    const cols = COLUNAS_CSV.filter(k => ['data', 'hora', 'treino', 'serie_ou_trecho'].includes(k) || (!['exercicio', 'grupo_muscular', 'tipo'].includes(k) && linhas.some(l => !vazio(l[k]))));
    abas.push({
      nome: nomeAba(ex),
      colunas: cols.map(k => k === 'serie_ou_trecho' && ehCardio(ex) ? 'Trecho' : TITULOS_PLANILHA[k]),
      linhas: linhas.map(l => cols.map(k => typeof l[k] === 'number' ? arred2(l[k]) : l[k] ?? '')),
    });
  }
  return abas.map(a => ({ ...a, hash: hashTxt(JSON.stringify(a)) }));
}

// Uma atualização por vez. Pedida durante outra (ou se faltaram abas na planilha), roda de novo no fim, até 3 vezes
async function atualizarPlanilha() {
  if (dr.planilha) { dr.planilhaDeNovo = true; return; }
  dr.planilha = true;
  try {
    for (let vez = 0; vez < 3; vez++) {
      dr.planilhaDeNovo = false;
      await enviarPlanilha();
      if (!dr.planilhaDeNovo) break;
    }
  } finally { dr.planilha = false; }
  renderDrive();
}
async function enviarPlanilha() {
  // As abas guardadas aqui só valem se foi este aparelho que escreveu a planilha por último
  const alvo = DR, abas = abasPlanilha(), nomes = abas.map(a => a.nome);
  const antes = DR.planilhaDe === DR.aparelhoId && DR.abas || {};
  const mudaram = abas.filter(a => antes[a.nome] !== a.hash);
  if (!mudaram.length && Object.keys(antes).every(n => nomes.includes(n))) return;
  try {
    // A primeira vez cria uma aba por exercício e pode levar alguns minutos
    const r = await nuvem('planilha', { aparelhoId: DR.aparelhoId, planilha: { nomes, abas: mudaram.map(({ hash, ...a }) => a) } }, alvo, 300000);
    if (DR !== alvo) return;
    guardarInfo(r);
    const faltando = new Set(Array.isArray(r.faltando) ? r.faltando : []);
    DR.abas = Object.fromEntries(abas.filter(a => !faltando.has(a.nome)).map(a => [a.nome, a.hash]));
    DR.planilhaErro = '';
    if (faltando.size) dr.planilhaDeNovo = true; // alguém apagou abas na planilha: manda de novo
  } catch (e) {
    if (DR !== alvo) return;
    DR.planilhaErro = e.message;
  }
  salvarDR();
}

// Liga este aparelho ao script: o primeiro registra uma chave nova; os outros chegam pelo link (endereço + chave)
async function conectarDrive(url, chave = '') {
  if (dr.conectando) return; // Enter duas vezes no campo não conecta duas vezes
  url = String(url || '').trim();
  if (!urlScriptOk(url)) return toast('Cole o endereço do script: começa com https://script.google.com/ e termina em /exec.');
  const anterior = DR.anterior?.url === url ? DR.anterior : {}; // reconectar ao mesmo script usa a mesma chave
  const alvo = { url, chave: chave || anterior.chave || chaveNova() };
  dr.conectando = true;
  renderDrive();
  let info;
  try { info = await nuvem('registrar', {}, alvo); }
  catch (e) { return toast(e.message); }
  finally { dr.conectando = false; renderDrive(); }
  const conta = info.conta || 'sua conta Google';
  let escolha = 'enviar';
  if (info.atualizado) {
    escolha = await dialogo({
      titulo: 'Já existe um backup no Drive',
      texto: [`O Google Drive de ${conta} tem um backup feito ${backupDe(info.atualizado, info.aparelho)}.`,
        'Restaurar troca os dados deste aparelho pelos do Drive. Substituir põe os dados deste aparelho no lugar, e o backup que estava lá fica guardado na pasta Cópias.'],
      botoes: [['restaurar', 'Restaurar o backup do Drive', 'primary'], ['substituir', 'Substituir pelo deste aparelho', 'ghost'], [null, 'Cancelar', 'ghost']],
      foco: 0,
    });
  } else if (chave) {
    // Veio por um link: mostra a conta antes de mandar os dados para ela
    const ok = await confirmar({ titulo: 'Conectar ao Google Drive?', texto: `Os backups deste aparelho vão para o Google Drive de ${conta}.`, ok: 'Conectar' });
    escolha = ok ? 'enviar' : null;
  }
  if (!escolha) return toast('Conexão cancelada.');
  DR = { url, chave: alvo.chave, aparelhoId: anterior.aparelhoId || DR.aparelhoId || uid(), abas: {} };
  guardarInfo(info);
  salvarDR();
  estadoDrive('ok');
  if (escolha === 'restaurar') return restaurarDrive({ perguntar: false });
  await fazerBackup({ manual: true, substituir: escolha === 'substituir' });
}

async function restaurarDrive({ perguntar = true } = {}) {
  const alvo = DR;
  toast('Buscando o backup no Drive…');
  let r;
  try { r = await nuvem('baixar', {}, alvo, 60000); }
  catch (e) { return toast(e.message); }
  if (DR !== alvo) return;
  guardarInfo(r);
  const d = r.backup && normalizar(r.backup.dados);
  if (!d) return toast('O Drive ainda não tem um backup para restaurar.');
  if (perguntar) {
    const ok = await confirmar({
      titulo: 'Restaurar o backup do Drive?',
      texto: `${trocaDados(`do backup feito ${backupDe(r.atualizado, r.aparelho)}`, d)}${avisoNoDialogo(r.backup.dados)}${S.sessao ? ' O treino em andamento será descartado.' : ''}`,
      ok: 'Restaurar backup',
    });
    if (!ok || DR !== alvo) return;
  }
  aplicarBackup(d, `Backup do Drive restaurado${avisoPrograma(r.backup.dados, d)}`);
  emDia(r.atualizado, hashDados());
}

async function substituirDrive() {
  const c = DR.conflito || {};
  const ok = await confirmar({
    titulo: 'Substituir o backup do Drive?',
    texto: `Os dados deste aparelho passam a ser o backup. O backup feito ${backupDe(c.atualizado, c.aparelho)} fica guardado na pasta Cópias do Drive.`,
    ok: 'Substituir backup',
  });
  if (ok) fazerBackup({ manual: true, substituir: true });
}

function desconectarDrive() {
  const antes = DR;
  DR = { anterior: { url: antes.url, chave: antes.chave, aparelhoId: antes.aparelhoId } };
  salvarDR();
  clearTimeout(dr.t);
  estadoDrive('ok');
  toast('Backup no Drive desligado. O que já está lá continua guardado.', () => { DR = antes; salvarDR(); renderDrive(); agendarBackup(1000); });
}

// Link para conectar outro aparelho: leva o endereço e a chave (quem tiver o link acessa o backup)
async function copiarLinkDrive() {
  const link = `${location.origin}${location.pathname.replace(/index\.html$/, '')}#conectar=${b64url(JSON.stringify({ u: DR.url, k: DR.chave }))}`;
  try { await navigator.clipboard.writeText(link); }
  catch {
    const campo = document.createElement('textarea');
    campo.value = link;
    campo.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(campo);
    campo.select();
    const ok = document.execCommand('copy');
    campo.remove();
    if (!ok) return toast('Não foi possível copiar o link neste navegador.');
  }
  toast('Link copiado. Abra no outro aparelho. Quem tiver este link acessa seu backup: mande só para você mesmo.');
}
function lerLinkConexao() {
  const m = location.hash.match(/^#conectar=([\w-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search); // o link (com a chave) sai da barra de endereço
  let o = null;
  try { o = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { /* link quebrado */ }
  if (typeof o?.u !== 'string' || typeof o?.k !== 'string' || !/^[\w-]{24,}$/.test(o.k)) return toast('Este link de conexão não é válido.');
  if (DR.url === o.u && DR.chave === o.k) return toast('Este aparelho já está conectado ao Google Drive.');
  ui.tab = 'ajustes';
  ui.libAberto = null;
  render(true);
  conectarDrive(o.u, o.k);
}

/* Painel em Ajustes (o conteúdo de #drive). O estado muda sem redesenhar a página inteira (não atrapalha quem está digitando) */
const ROTULO_DRIVE = { ok: 'Backup em dia', pendente: 'Mudanças a enviar', enviando: 'Fazendo backup…', offline: 'Sem internet', erro: 'O backup falhou', conflito: 'Backup de outro aparelho no Drive' };
function driveHTML() {
  if (!driveLigado()) return `
      <div class="panel-texto"><h2>Backup no Google Drive</h2><p class="small muted">Uma cópia de tudo no seu Google Drive, sem precisar lembrar: o backup vai sozinho quando você conclui um treino e quando algo muda. Para começar, publique uma vez o script de backup na sua conta Google e cole aqui o endereço dele.</p></div>
      <div class="drive-conectar">
        <label class="fld"><span>Endereço do script (termina em /exec)</span><input class="field" id="drive-url" type="url" value="${esc(dr.url ?? DR.anterior?.url ?? '')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <button class="btn primary" data-act="drive-conectar"${dr.conectando ? ' disabled' : ''}>${dr.conectando ? 'Conectando…' : 'Conectar'}</button>
      </div>`;
  const c = DR.conflito;
  const estado = c ? 'conflito' : dr.estado === 'ok' && dr.pendente ? 'pendente' : dr.estado;
  const detalhe = {
    ok: DR.versao ? `Último backup ${quandoTxt(Date.parse(DR.versao))}.` : 'Nenhum backup ainda.',
    pendente: 'As últimas mudanças vão para o Drive em instantes.',
    enviando: 'Enviando seus dados para o Drive.',
    offline: dr.msg,
    erro: dr.msg,
    conflito: c && `O Drive recebeu um backup feito ${backupDe(c.atualizado, c.aparelho)}, depois do último deste aparelho. Escolha qual fica: o que sair é guardado na pasta Cópias do Drive.`,
  }[estado];
  const acoes = c
    ? '<button class="btn primary small" data-act="drive-restaurar">Restaurar o do Drive</button><button class="btn ghost small" data-act="drive-substituir">Substituir pelo deste aparelho</button>'
    : '<button class="btn primary small" data-act="drive-backup">Fazer backup agora</button><button class="btn ghost small" data-act="drive-restaurar">Restaurar do Drive</button>';
  const links = [[DR.planilha, 'Abrir planilha'], [DR.pasta, 'Abrir pasta']].filter(([u]) => linkGoogleOk(u))
    .map(([u, rotulo]) => `<a class="btn ghost small" href="${esc(u)}" target="_blank" rel="noopener">${rotulo}</a>`).join('');
  return `
      <div class="panel-texto"><h2>Backup no Google Drive</h2><p class="small muted conta">${esc(DR.conta || 'Conectado')}</p></div>
      <div class="drive-sit" data-st="${estado}"><span class="drive-ponto" aria-hidden="true"></span><div><b>${ROTULO_DRIVE[estado]}</b>${detalhe ? `<p class="small muted">${esc(detalhe)}</p>` : ''}${DR.planilhaErro && !c ? `<p class="small muted">A planilha não foi atualizada: ${esc(DR.planilhaErro)}</p>` : ''}</div></div>
      <div class="backup-actions">${acoes}${links}</div>
      <p class="hint">No Drive, a pasta Planner de treino guarda o backup completo, a planilha com uma aba por exercício e, na pasta Cópias, como tudo estava no início de cada dia. Para voltar a uma cópia antiga, baixe o arquivo dela e use Importar backup, aqui embaixo.</p>
      <div class="backup-actions"><button class="btn ghost small" data-act="drive-link">Conectar outro aparelho</button><button class="btn text-danger small" data-act="drive-sair">Desconectar</button></div>`;
}
function estadoDrive(estado, msg = '') {
  dr.estado = estado;
  dr.msg = msg;
  renderDrive();
}
function renderDrive() {
  $('[data-tab="ajustes"]')?.toggleAttribute('data-alerta', !!DR.conflito || dr.estado === 'erro');
  const el = $('#drive');
  if (el) trocarHTML(el, driveHTML());
}

/* ---------- Ações da Biblioteca ---------- */
async function arquivarExercicio(id) {
  const ex = exPorId(id);
  if (!ex) return;
  const chave = chaveDe(ex), nome = nomeItem(ex), { treinos } = situacoes()(ex);
  if (treinos.length) {
    const ok = await confirmar({
      titulo: `Arquivar ${nome}?`,
      texto: `Ele sai ${treinos.length > 1 ? 'dos treinos' : 'do treino'} ${listaE(treinos)}. Todos os registros continuam guardados aqui na Biblioteca.`,
      ok: 'Arquivar',
    });
    if (!ok) return;
  }
  comDesfazer(`${nome}: arquivado`, () => {
    S.treinos.forEach(t => { t.exercicios = t.exercicios.filter(e => !(nomeado(e) && chaveDe(e) === chave)); });
    ex.arquivado = true;
  });
}

function desarquivarExercicio(id) {
  const ex = exPorId(id);
  if (ex) comDesfazer('Fora do arquivo. Para treinar com ele, adicione a um treino.', () => { ex.arquivado = false; });
}

// Renomear: o histórico segue o exercício. Se o nome novo já existe na Biblioteca, oferece juntar os dois
async function renomearExercicio(id, texto) {
  const ex = exPorId(id), nome = texto.trim();
  if (!ex || ehCardio(ex) || nome === ex.nome) return;
  if (!chaveNome(nome)) return render(); // nome vazio: volta o anterior
  const outro = S.biblioteca.find(x => x !== ex && chaveDe(x) === chaveDe({ nome }));
  if (outro) {
    const ok = await confirmar({
      titulo: 'Juntar com o exercício que já existe?',
      texto: `"${outro.nome}" já está na Biblioteca. Os registros de "${ex.nome}" passam para ele, e os dois viram um exercício só.`,
      ok: 'Juntar',
    });
    if (!ok) return render();
    ui.libAberto = outro.id;
  }
  // Só renomear: o campo já mostra o nome novo, então a página não é redesenhada (um clique logo em seguida,
  // em Exportar ou Arquivar, não se perde). Juntar e desfazer redesenham.
  comDesfazer(outro ? 'Exercícios juntados' : 'Nome alterado', () => trocarExercicio(ex, outro || nome), render, outro ? render : () => {});
}

// Troca o nome de um exercício (destino = texto) ou junta com outro (destino = exercício): treinos (também os dos
// Programas salvos) com o nome antigo, a sessão e o histórico passam a apontar para o novo
function trocarExercicio(ex, destino) {
  const antes = chaveDe(ex);
  // O grupo muscular acompanha o nome novo, se você não tinha escolhido outro
  if (typeof destino === 'string' && ex.grupo === grupoPeloNome(ex.nome)) ex.grupo = grupoPeloNome(destino);
  const novo = typeof destino === 'string' ? Object.assign(ex, { nome: destino }) : destino;
  for (const { e } of itensNomeados(S, true)) if (!ehCardio(e) && chaveDe(e) === antes) e.nome = novo.nome;
  for (const e of [...S.historico.flatMap(h => h.exercicios), ...(S.sessao?.exercicios || [])]) {
    if (e.exId === ex.id) { e.exId = novo.id; e.nome = novo.nome; }
  }
  if (novo !== ex) {
    S.biblioteca = S.biblioteca.filter(x => x !== ex);
    novo.arquivado = novo.arquivado && ex.arquivado;
  }
}

// Ao terminar de digitar o nome no editor, o exercício do treino se liga ao da Biblioteca
// (com o nome escrito como lá) e volta do arquivo, se estava arquivado
function ligarNome(el) {
  const item = exDoTreino(el.dataset.t, el.dataset.id);
  if (!item || !nomeado(item)) return;
  const ex = exercicioDe(S, item), estavaArquivado = ex.arquivado;
  if (item.nome !== ex.nome) { item.nome = ex.nome; el.value = ex.nome; }
  salvarAgora(); // a gravação tira do arquivo e limpa o nome anterior, se ele era só um nome digitado
  if (estavaArquivado) toast(`${ex.nome} voltou do arquivo, com todo o histórico.`);
}

$('#import-file').addEventListener('change', async ev => {
  const arquivo = ev.target.files[0];
  ev.target.value = '';
  if (!arquivo) return;
  let d = null, bruto = null;
  try { const j = JSON.parse(await arquivo.text()); bruto = j.dados || j; d = normalizar(bruto); } catch { d = null; }
  if (!d) { toast('Este arquivo não é um backup do Planner de treino.'); return; }
  const ok = await confirmar({
    titulo: 'Importar backup?',
    texto: trocaDados('do arquivo', d) + avisoNoDialogo(bruto),
    ok: 'Importar backup',
  });
  if (ok) aplicarBackup(d, `Backup importado${avisoPrograma(bruto, d)}`);
});

/* ---------- Avisos, desfazer e diálogos ---------- */
function toast(msg, desfazer) {
  const root = $('#toast-root');
  ui.desfazer = desfazer || null;
  root.innerHTML = `<div class="toast${desfazer ? ' has-action' : ''}" role="status"><span>${esc(msg)}</span>${desfazer ? '<button class="toast-btn" data-act="desfazer">Desfazer</button>' : ''}</div>`;
  clearTimeout(ui.toastT);
  // Avisos longos (erros do backup, por exemplo) ficam mais tempo, para dar tempo de ler
  ui.toastT = setTimeout(() => { root.innerHTML = ''; ui.desfazer = null; }, desfazer ? 6000 : Math.max(3200, msg.length * 60));
}

// Faz a mudança, grava e redesenha; o aviso traz "Desfazer". aoFazer redesenha logo depois da mudança
// (por padrão, igual a redesenhar, que roda ao desfazer)
function comDesfazer(msg, mudar, redesenhar = render, aoFazer = redesenhar) {
  const antes = structuredClone(S);
  mudar();
  salvarAgora();
  aoFazer();
  toast(msg, () => { S = antes; salvarAgora(); redesenhar(); });
}

// Diálogo próprio. botoes = [[valor, rótulo, classe], ...] na ordem da tela (com 3 ou mais, um embaixo do outro);
// texto pode ser uma lista de parágrafos. Fechar (Esc, ou tocar fora) devolve null.
function dialogo({ titulo, texto, botoes, foco = botoes.length - 1 }) {
  ui.fecharDialogo?.(); // nunca empilha dois diálogos
  return new Promise(resolve => {
    const root = $('#dialog-root');
    const antes = document.activeElement;
    root.innerHTML = `<div class="dlg-wrap"><div class="dlg-backdrop" data-r=""></div>
      <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
        <h2 id="dlg-t">${esc(titulo)}</h2><div class="dlg-texto" id="dlg-d">${[].concat(texto).map(p => `<p>${esc(p)}</p>`).join('')}</div>
        <div class="dlg-actions${botoes.length > 2 ? ' empilhar' : ''}">${botoes.map(([, rotulo, cls], i) => `<button class="btn ${cls}" data-r="${i}">${esc(rotulo)}</button>`).join('')}</div>
      </div></div>`;
    const fim = v => { root.innerHTML = ''; root.onclick = null; ui.fecharDialogo = null; antes?.focus?.({ preventScroll: true }); resolve(v); };
    root.onclick = e => { const b = e.target.closest('[data-r]'); if (b) fim(b.dataset.r ? botoes[+b.dataset.r][0] : null); };
    ui.fecharDialogo = () => fim(null);
    root.querySelectorAll('.dlg-actions .btn')[foco].focus();
  });
}
const confirmar = ({ titulo, texto, ok, nao = 'Voltar', perigo = false }) =>
  dialogo({ titulo, texto, botoes: [[false, nao, 'ghost'], [true, ok, perigo ? 'danger' : 'primary']], foco: perigo ? 0 : 1 }).then(v => v === true);

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const { act, id, t, d, i, tab } = b.dataset;
  switch (act) {
    // Tocar na aba de novo (ou voltar a ela) mostra a lista da Biblioteca, não a página do último exercício
    case 'tab': if (ui.tab !== tab || ui.libAberto) { ui.tab = tab; ui.libAberto = null; render(true); window.scrollTo(0, 0); } break;
    case 'lib-abrir': ui.libAberto = id; render(true); window.scrollTo(0, 0); break;
    case 'lib-voltar': {
      const aberto = ui.libAberto;
      ui.libAberto = null;
      render(true);
      document.querySelector(`[data-act="lib-abrir"][data-id="${CSS.escape(aberto || '')}"]`)?.focus();
      break;
    }
    case 'lib-filtro': ui.libFiltro = b.dataset.p; render(); break;
    case 'periodo-ex': ui.periodoEx = b.dataset.p; render(); break;
    case 'periodo-peso': ui.periodoPeso = b.dataset.p; render(); break;
    case 'peso-registrar': registrarPeso(); break;
    case 'peso-apagar': comDesfazer(`Peso de ${dataDoDia(d)} apagado`, () => apagarPeso(d)); break;
    case 'lib-arquivar': arquivarExercicio(id); break;
    case 'lib-desarquivar': desarquivarExercicio(id); break;
    case 'lib-exportar': exportarCSV(id); break;
    case 'exportar-csv': exportarCSV(); break;
    case 'iniciar': iniciarTreino(id); break;
    case 'abrir-ex': if (id) abrirEx(id); break;
    case 'fechar-ex': fecharEx(); break;
    case 'serie-feita': marcarSerie(+i); break;
    case 'mais': alternarMais(+i); break;
    case 'add-serie': adicionarSerie(); break;
    case 'remover-serie': removerSerie(); break;
    // Liga e desliga, no exercício do treino: prioridade, F e bi-set (o bi-set redesenha, para mostrar o par)
    case 'prio': case 'falha': case 'biset': {
      const ex = exDoTreino(t, id), k = act === 'prio' ? 'prioridade' : act;
      if (!ex) break;
      ex[k] = !ex[k];
      b.setAttribute('aria-pressed', String(ex[k]));
      salvar();
      if (k === 'biset') render();
      break;
    }
    case 'prog-ver': ui.progAberto.has(id) ? ui.progAberto.delete(id) : ui.progAberto.add(id); render(); break;
    case 'prog-salvar': comDesfazer('Cópia salva em Programas salvos', () => guardarPrograma(S)); break;
    case 'prog-usar': usarPrograma(id); break;
    case 'prog-apagar': apagarPrograma(id); break;
    case 'periodo': ui.periodo = b.dataset.p; render(); break;
    case 'instalar': instalarApp(); break;
    case 'finalizar-ex': finalizarEx(); break;
    case 'timer-play': playPause(); break;
    case 'timer-zerar': zerar(); break;
    case 'timer-ajuste': ajustarDescanso(+d); break;
    case 'concluir-treino': concluirTreino(); break;
    case 'cancelar-treino': cancelarTreino(); break;
    case 'novo-treino': novoTreino(); break;
    case 'add-ex': adicionarItem(t, novoExercicio()); break;
    case 'add-cardio': adicionarItem(t, novoCardio()); break;
    case 'aparelho': escolherAparelho(t, id, b.dataset.a, b); break;
    case 'dia': alternarDia(t, +d, b); break;
    case 'apagar-treino': {
      const tr = treinoPorId(t);
      if (tr) comDesfazer(`${tr.nome || 'Treino'} apagado`, () => { S.treinos = S.treinos.filter(x => x.id !== t); });
      break;
    }
    case 'apagar-ex': {
      const tr = treinoPorId(t);
      const ex = exDoTreino(t, id);
      if (ex) comDesfazer(`${ehCardio(ex) ? 'Cardio' : ex.nome || 'Exercício'} removido`, () => { tr.exercicios = tr.exercicios.filter(x => x.id !== id); });
      break;
    }
    case 'hist': ui.histAberto.has(id) ? ui.histAberto.delete(id) : ui.histAberto.add(id); render(); break;
    case 'apagar-hist': comDesfazer('Registro apagado', () => { S.historico = S.historico.filter(h => h.id !== id); }); break;
    case 'exportar': exportar(); break;
    case 'importar': $('#import-file').click(); break;
    case 'drive-conectar': conectarDrive($('#drive-url')?.value); break;
    case 'drive-backup': fazerBackup({ manual: true }); break;
    case 'drive-restaurar': restaurarDrive(); break;
    case 'drive-substituir': substituirDrive(); break;
    case 'drive-link': copiarLinkDrive(); break;
    case 'drive-sair': desconectarDrive(); break;
    case 'desfazer': {
      const desfazer = ui.desfazer;
      ui.desfazer = null;
      if (desfazer) { desfazer(); toast('Desfeito'); }
      break;
    }
  }
});

// Cada campo editável aponta para [objeto, chave]: "t-*" é o treino, "e-*" o exercício (ou cardio) do treino,
// "s-*" a série ou trecho da janela aberta, "r-*" o descanso de um tipo de série (A, P ou T) do exercício aberto,
// "g-*" o programa em uso, "k-*" um programa salvo e "p-*" o peso e a altura da pessoa (o peso é o de agora, da aba
// Peso: o campo só mostra, e registrarPesoDeHoje grava)
function alvoCampo(el) {
  const { f, t, id, i } = el.dataset;
  if (f?.startsWith('t-')) return [treinoPorId(t), f.slice(2)];
  if (f?.startsWith('g-')) return [S.programa, f.slice(2)];
  if (f?.startsWith('k-')) return [programaPorId(id), f.slice(2)];
  if (f?.startsWith('e-')) return [exDoTreino(t, id), f.slice(2)];
  if (f?.startsWith('s-')) return [exAberto()?.sets[+i], f.slice(2)];
  if (f?.startsWith('r-')) return [exAberto(), CAMPO_DESCANSO[f.slice(2)]];
  if (f === 'p-peso') return [corpoAtual(), 'peso'];
  if (f?.startsWith('p-')) return [S.perfil, f.slice(2)];
  return [];
}

function aplicarCampo(el) {
  const [obj, k] = alvoCampo(el);
  if (!obj) return;
  const { f } = el.dataset;
  const v = el.value.trim();
  if (f.startsWith('r-')) return guardarDescanso(obj, f.slice(2), v, el);
  if (k === 'nome' || k === 'foco' || k === 'meta' || k === 'obs') obj[k] = el.value;
  else if (f === 'e-reps') { if (v) obj.reps = textoReps(v); }
  else if (f === 'e-series') obj.series = clampInt(v, 1, 99, obj.series);
  else if (f === 'e-descanso') obj.descanso = clampInt(v, 5, 600, obj.descanso);
  else if (f === 'e-preparo') { if (temChave(PLANOS, v)) obj.preparo = v; }
  else if (f === 'g-inicio') obj.inicio = lerDataISO(v);
  else obj[k] = lerCampo(k, v); // séries, trechos, peso e altura
  salvar();
}

document.addEventListener('input', ev => {
  const el = ev.target;
  // Busca da Biblioteca: refaz só a lista, para o campo não perder o foco
  if (el.id === 'lib-busca') { ui.libBusca = el.value; $('#lib-lista').innerHTML = listaBibliotecaHTML(); return; }
  if (el.id === 'drive-url') { dr.url = el.value; return; } // o endereço digitado continua no campo se o painel redesenhar
  // Campo de número aceita só o que cabe nele: pelo tipo do campo (data-f) ou, sem ele, por data-filtro
  const tipo = el.dataset?.filtro ?? el.dataset?.f?.slice(2);
  if (tipo && el.classList.contains('num')) {
    const limpo = el.value.replace(filtroDe(tipo), '');
    if (limpo !== el.value) el.value = limpo;
  }
  if (!el.dataset?.f) return;
  // O descanso e o seu peso gravam quando a pessoa termina de digitar (change)
  if (el.dataset.f.startsWith('r-') || el.dataset.f === 'p-peso') return;
  aplicarCampo(el);
  if (/^[sp]-/.test(el.dataset.f)) atualizarCalc();
  if (el.dataset.f === 's-peso') atualizarPreparo(+el.dataset.i);
});

// Nome do exercício na Biblioteca: renomeia ao sair do campo (ou ao apertar Enter). Grupo muscular: muda na hora
document.addEventListener('change', ev => {
  if (ev.target.id === 'ex-nome') renomearExercicio(ui.libAberto, ev.target.value);
  // Descanso de um tipo de série: vale para as séries desse tipo e o cronômetro parado já mostra o novo
  if (ev.target.dataset?.f?.startsWith('r-')) { aplicarCampo(ev.target); atualizarTimerUI(); }
  if (ev.target.id === 'ex-grupo') {
    const ex = exPorId(ui.libAberto);
    if (ex && grupoValido(ev.target.value)) { ex.grupo = ev.target.value; salvarAgora(); }
  }
  if (ev.target.dataset?.f === 'g-inicio') render(); // a semana do programa muda com a data
  if (ev.target.dataset?.pesoDia) corrigirPeso(ev.target); // peso corrigido na lista da aba Peso
  if (ev.target.dataset?.f === 'p-peso') registrarPesoDeHoje(ev.target); // seu peso, em Ajustes ou no cardio
});

// Campo de número (e de repetições) fica vazio ao clicar; se sair sem digitar, volta o valor anterior
const CAMPO_LIMPA = 'input.num, input.limpa';
document.addEventListener('focusin', ev => {
  const el = ev.target;
  if (el.matches?.(CAMPO_LIMPA)) { el.dataset.antes = el.value; el.value = ''; }
});
document.addEventListener('focusout', ev => {
  const el = ev.target;
  if (el.dataset?.f === 'e-nome') return ligarNome(el);
  if (!el.matches?.(CAMPO_LIMPA)) return;
  if (el.value === '' && el.dataset.antes) { el.value = el.dataset.antes; aplicarCampo(el); }
  // Mostra o valor como ficou guardado (ex.: "22.50" vira "22,5"; séries fora de 1 a 99 voltam ao limite)
  const [obj, k] = alvoCampo(el);
  if (obj) el.value = mostrarCampo(k, obj[k]);
  delete el.dataset.antes;
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'drive-url') return conectarDrive(ev.target.value);
  if (ev.key === 'Enter' && ev.target.id === 'peso-kg') return registrarPeso();
  // Mantém o Tab dentro do diálogo ou da janela do exercício abertos
  if (ev.key === 'Tab') {
    const modal = $('.dlg') || $('.sheet');
    if (!modal) return;
    const focaveis = [...modal.querySelectorAll('button, input, select')].filter(el => !el.disabled && el.offsetParent);
    const primeiro = focaveis[0], ultimo = focaveis[focaveis.length - 1];
    if (!modal.contains(document.activeElement)) { ev.preventDefault(); primeiro?.focus(); }
    else if (ev.shiftKey && document.activeElement === primeiro) { ev.preventDefault(); ultimo.focus(); }
    else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primeiro.focus(); }
    return;
  }
  if (ev.key !== 'Escape') return;
  if (ui.fecharDialogo) ui.fecharDialogo();
  else if (ui.exAberto) fecharEx();
});

// Guarda o app no aparelho para abrir sem internet (o navegador só permite isso em http/https)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Modo sem internet indisponível:', err));
  });
}

// Quando o Chrome avisa que o app pode ser instalado, aparece o botão "Instalar app"
let pedidoInstalar = null;
function definirPedido(e) {
  pedidoInstalar = e;
  $('#instalar').hidden = !e;
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); definirPedido(e); });
window.addEventListener('appinstalled', () => { definirPedido(null); toast('App instalado. Ele está na tela inicial.'); });
async function instalarApp() {
  if (!pedidoInstalar) return;

  await pedidoInstalar.userChoice;

}
